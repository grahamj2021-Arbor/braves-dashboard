name: Daily Health Check

on:
  schedule:
    - cron: '0 11 * * *'   # targets 9 AM ET; runs early to absorb GitHub cron queue lag (observed 1–2 hrs)
  workflow_dispatch:         # manual trigger any time

jobs:
  health-check:
    name: Health Check — bravesdashboards.com
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write          # needed to open a failure issue

    steps:
      # ── 1. STATIC CHECKS (no network needed) ────────────────────────────
      - name: Checkout
        run: git clone --depth 1 "https://github.com/${{ github.repository }}.git" .

      - name: Static — key DOM IDs present in source
        id: static_dom
        run: |
          FAILS=0
          for NEEDLE in "id=\"hdr-rec\"" "id=\"hdr-game-strip\"" "id=\"content\"" "id=\"refresh-pill\"" "id=\"last-updated\""; do
            if grep -q "$NEEDLE" index.html; then
              echo "  ✅ $NEEDLE" >> $GITHUB_STEP_SUMMARY
            else
              echo "  ❌ MISSING: $NEEDLE" >> $GITHUB_STEP_SUMMARY
              FAILS=$((FAILS+1))
            fi
          done
          echo "dom_fails=$FAILS" >> $GITHUB_OUTPUT

      - name: Static — key JS functions present
        id: static_js
        run: |
          FAILS=0
          for FN in "refreshAll" "fetchLiveData" "mergeLiveData" "updateHdrContext" "renderOverview" "renderCards" "renderSchedule" "applyTab" "bindDynamic"; do
            if grep -q "$FN" app.js; then
              echo "  ✅ $FN()" >> $GITHUB_STEP_SUMMARY
            else
              echo "  ❌ MISSING: $FN()" >> $GITHUB_STEP_SUMMARY
              FAILS=$((FAILS+1))
            fi
          done
          # localTake is the server-side fallback in api/chat.js, not index.html
          if grep -q "localTake" api/chat.js; then
            echo "  ✅ localTake() [api/chat.js]" >> $GITHUB_STEP_SUMMARY
          else
            echo "  ❌ MISSING: localTake() [api/chat.js]" >> $GITHUB_STEP_SUMMARY
            FAILS=$((FAILS+1))
          fi
          echo "js_fails=$FAILS" >> $GITHUB_OUTPUT

      - name: Static — no stale AI-insight references
        id: static_stale
        run: |
          STALE=0
          for SYM in "aiInsightCache" "aiInsightTimer" "fetchAiInsight"; do
            if grep -q "$SYM" app.js; then
              echo "  ❌ STALE REFERENCE: $SYM" >> $GITHUB_STEP_SUMMARY
              STALE=$((STALE+1))
            fi
          done
          if [ $STALE -eq 0 ]; then echo "  ✅ No stale AI-insight symbols" >> $GITHUB_STEP_SUMMARY; fi
          echo "stale_fails=$STALE" >> $GITHUB_OUTPUT

      - name: Static — CORS no longer wildcard in api/chat.js
        id: static_cors
        run: |
          if grep -q "Allow-Origin.*\*" api/chat.js; then
            echo "  ❌ Wildcard CORS still present in api/chat.js" >> $GITHUB_STEP_SUMMARY
            echo "cors_fail=1" >> $GITHUB_OUTPUT
          else
            echo "  ✅ CORS is locked (no wildcard)" >> $GITHUB_STEP_SUMMARY
            echo "cors_fail=0" >> $GITHUB_OUTPUT
          fi

      - name: Static — no http:// mixed content
        id: static_https
        run: |
          MIXED=$(grep -oP 'src="http://[^"]*"|href="http://[^"]*"' index.html || true)
          if [ -n "$MIXED" ]; then
            echo "  ❌ Mixed content found:" >> $GITHUB_STEP_SUMMARY
            echo "$MIXED" >> $GITHUB_STEP_SUMMARY
            echo "https_fail=1" >> $GITHUB_OUTPUT
          else
            echo "  ✅ No mixed content (all resources HTTPS)" >> $GITHUB_STEP_SUMMARY
            echo "https_fail=0" >> $GITHUB_OUTPUT
          fi

      - name: Static — player names escaped before innerHTML
        id: static_xss
        run: |
          FAILS=0
          for SYM in "pcEsc(b.name)" "pcEsc(p.name)" "pcEsc(tb.name)" "pcEsc(tp.name)" "pcEsc(t.name)"; do
            if grep -qF "$SYM" app.js; then
              echo "  ✅ $SYM" >> $GITHUB_STEP_SUMMARY
            else
              echo "  ❌ MISSING XSS GUARD: $SYM" >> $GITHUB_STEP_SUMMARY
              FAILS=$((FAILS+1))
            fi
          done
          echo "xss_fails=$FAILS" >> $GITHUB_OUTPUT

      - name: Static — no eval() in client code
        id: static_eval
        run: |
          if grep -qP '\beval\s*\(' app.js; then
            echo "  ❌ eval() found in app.js" >> $GITHUB_STEP_SUMMARY
            echo "eval_fail=1" >> $GITHUB_OUTPUT
          else
            echo "  ✅ No eval() in client code" >> $GITHUB_STEP_SUMMARY
            echo "eval_fail=0" >> $GITHUB_OUTPUT
          fi

      - name: Static — API key from environment only
        id: static_apikey
        run: |
          FAILS=0
          if grep -q "process.env.OPENROUTER_API_KEY" api/chat.js; then
            echo "  ✅ OPENROUTER_API_KEY read from process.env" >> $GITHUB_STEP_SUMMARY
          else
            echo "  ❌ OPENROUTER_API_KEY not found in api/chat.js" >> $GITHUB_STEP_SUMMARY
            FAILS=$((FAILS+1))
          fi
          if grep -qP 'sk-or-[a-zA-Z0-9_-]{20,}' api/chat.js index.html app.js 2>/dev/null; then
            echo "  ❌ Hardcoded OpenRouter key detected in source!" >> $GITHUB_STEP_SUMMARY
            FAILS=$((FAILS+1))
          else
            echo "  ✅ No hardcoded API key in source files" >> $GITHUB_STEP_SUMMARY
          fi
          echo "apikey_fails=$FAILS" >> $GITHUB_OUTPUT

      - name: Static — CSP has no unsafe-inline for scripts
        id: static_csp
        run: |
          FAILS=0
          if grep -q "script-src 'self' 'unsafe-inline'" vercel.json; then
            echo "  ❌ script-src still allows 'unsafe-inline'" >> $GITHUB_STEP_SUMMARY
            FAILS=$((FAILS+1))
          else
            echo "  ✅ script-src does not allow 'unsafe-inline'" >> $GITHUB_STEP_SUMMARY
          fi
          # Inline on* handlers would be blocked by that CSP at runtime
          INLINE=$(grep -oP '\son(click|error|load|wheel|change|submit)="' index.html || true)
          if [ -n "$INLINE" ]; then
            echo "  ❌ Inline event handlers present in index.html (CSP would block them):" >> $GITHUB_STEP_SUMMARY
            echo "$INLINE" >> $GITHUB_STEP_SUMMARY
            FAILS=$((FAILS+1))
          else
            echo "  ✅ No inline event handlers in index.html" >> $GITHUB_STEP_SUMMARY
          fi
          echo "csp_fails=$FAILS" >> $GITHUB_OUTPUT

      - name: Static — app.js parses as valid JavaScript
        id: static_parse
        run: |
          if node --check app.js 2>/tmp/parse.err; then
            echo "  ✅ app.js parses cleanly" >> $GITHUB_STEP_SUMMARY
            echo "parse_fail=0" >> $GITHUB_OUTPUT
          else
            echo "  ❌ app.js has a syntax error:" >> $GITHUB_STEP_SUMMARY
            cat /tmp/parse.err >> $GITHUB_STEP_SUMMARY
            echo "parse_fail=1" >> $GITHUB_OUTPUT
          fi

      # ── 2. LIVE ENDPOINT CHECKS ─────────────────────────────────────────
      - name: Live — homepage returns 200
        id: live_home
        run: |
          HTTP=$(curl -s -o /tmp/homepage.html -w "%{http_code}" --max-time 20 https://bravesdashboards.com) || HTTP="000"
          if [ "$HTTP" = "200" ]; then
            echo "  ✅ Homepage: HTTP $HTTP" >> $GITHUB_STEP_SUMMARY
            echo "home_fail=0" >> $GITHUB_OUTPUT
          else
            echo "  ❌ Homepage: HTTP $HTTP" >> $GITHUB_STEP_SUMMARY
            echo "home_fail=1" >> $GITHUB_OUTPUT
          fi

      - name: Live — key elements in served HTML
        id: live_dom
        run: |
          FAILS=0
          curl -s -o /tmp/app.js --max-time 20 https://bravesdashboards.com/app.js || true
          for NEEDLE in "hdr-rec" "hdr-game-strip" "app.js" "BRAVES DASHBOARD"; do
            if grep -q "$NEEDLE" /tmp/homepage.html 2>/dev/null; then
              echo "  ✅ Found in live page: $NEEDLE" >> $GITHUB_STEP_SUMMARY
            else
              echo "  ❌ Missing from live page: $NEEDLE" >> $GITHUB_STEP_SUMMARY
              FAILS=$((FAILS+1))
            fi
          done
          echo "live_dom_fails=$FAILS" >> $GITHUB_OUTPUT

      - name: Live — security headers present
        id: live_headers
        run: |
          HEADERS=$(curl -s -I --max-time 15 https://bravesdashboards.com) || HEADERS=""
          FAILS=0
          for HDR in "x-content-type-options" "x-frame-options" "strict-transport-security" "content-security-policy"; do
            if echo "$HEADERS" | grep -qi "$HDR"; then
              echo "  ✅ Header present: $HDR" >> $GITHUB_STEP_SUMMARY
            else
              echo "  ❌ Header missing: $HDR" >> $GITHUB_STEP_SUMMARY
              FAILS=$((FAILS+1))
            fi
          done
          echo "header_fails=$FAILS" >> $GITHUB_OUTPUT

      - name: Live — Chop Bot API responds
        id: live_api
        run: |
          RESP=$(curl -s --max-time 25 \
            -X POST https://bravesdashboards.com/api/chat \
            -H "Content-Type: application/json" \
            -H "Origin: https://bravesdashboards.com" \
            -d '{"messages":[{"role":"user","content":"health check ping — one sentence only"}]}') || RESP=""
          if echo "$RESP" | grep -q '"text"'; then
            echo "  ✅ Chop Bot API: returned a text response" >> $GITHUB_STEP_SUMMARY
            echo "api_fail=0" >> $GITHUB_OUTPUT
          else
            echo "  ❌ Chop Bot API: unexpected response: $RESP" >> $GITHUB_STEP_SUMMARY
            echo "api_fail=1" >> $GITHUB_OUTPUT
          fi

      - name: Live — API rejects wrong origin
        id: live_cors
        run: |
          RESP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            -X POST https://bravesdashboards.com/api/chat \
            -H "Content-Type: application/json" \
            -H "Origin: https://evil.example.com" \
            -d '{"messages":[{"role":"user","content":"test"}]}') || RESP="000"
          if [ "$RESP" = "403" ]; then
            echo "  ✅ CORS enforcement: rejected evil.example.com with 403" >> $GITHUB_STEP_SUMMARY
            echo "cors_enforce_fail=0" >> $GITHUB_OUTPUT
          else
            echo "  ❌ CORS enforcement: expected 403, got $RESP" >> $GITHUB_STEP_SUMMARY
            echo "cors_enforce_fail=1" >> $GITHUB_OUTPUT
          fi

      # ── 3. FINAL SUMMARY + FAILURE ISSUE ────────────────────────────────
      - name: Collate results
        id: collate
        if: always()
        run: |
          F1="${{ steps.static_dom.outputs.dom_fails }}"
          F2="${{ steps.static_js.outputs.js_fails }}"
          F3="${{ steps.static_stale.outputs.stale_fails }}"
          F4="${{ steps.static_cors.outputs.cors_fail }}"
          F5="${{ steps.static_https.outputs.https_fail }}"
          F6="${{ steps.live_home.outputs.home_fail }}"
          F7="${{ steps.live_dom.outputs.live_dom_fails }}"
          F8="${{ steps.live_headers.outputs.header_fails }}"
          F9="${{ steps.live_api.outputs.api_fail }}"
          F10="${{ steps.live_cors.outputs.cors_enforce_fail }}"
          F11="${{ steps.static_xss.outputs.xss_fails }}"
          F12="${{ steps.static_eval.outputs.eval_fail }}"
          F13="${{ steps.static_apikey.outputs.apikey_fails }}"
          F14="${{ steps.static_csp.outputs.csp_fails }}"
          F15="${{ steps.static_parse.outputs.parse_fail }}"
          TOTAL_FAILS=$(( ${F1:-0}+${F2:-0}+${F3:-0}+${F4:-0}+${F5:-0}+${F6:-0}+${F7:-0}+${F8:-0}+${F9:-0}+${F10:-0}+${F11:-0}+${F12:-0}+${F13:-0}+${F14:-0}+${F15:-0} ))
          DATE=$(date -u '+%Y-%m-%d')
          if [ "$TOTAL_FAILS" -eq 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## ✅ HEALTHY — $DATE" >> $GITHUB_STEP_SUMMARY
            echo "All 15 checks passed. bravesdashboards.com is live and healthy." >> $GITHUB_STEP_SUMMARY
            echo "overall=pass" >> $GITHUB_OUTPUT
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## ❌ UNHEALTHY — $DATE — $TOTAL_FAILS check(s) failed" >> $GITHUB_STEP_SUMMARY
            echo "overall=fail" >> $GITHUB_OUTPUT
          fi
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Ensure health-check label exists
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "health-check" \
            --repo ${{ github.repository }} \
            --color "0075ca" \
            --description "Automated daily health check" 2>/dev/null || true

      - name: Open GitHub issue on failure
        if: steps.collate.outputs.overall == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.collate.outputs.date }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo ${{ github.repository }} --state open --label "health-check" --json number --jq length)
          if [ "$EXISTING" -eq 0 ]; then
            printf 'The daily health check failed on **%s**.\n\nSee the [full workflow run](%s) for which checks failed and why.\n\nThis issue will be closed automatically when the next health check passes.' \
              "$DATE" "$RUN_URL" > /tmp/issue_body.md
            gh issue create \
              --repo ${{ github.repository }} \
              --title "⚠️ Health check failed — $DATE" \
              --label "health-check" \
              --body-file /tmp/issue_body.md || true
          fi

      - name: Close any open health-check issues on pass
        if: steps.collate.outputs.overall == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list \
            --repo ${{ github.repository }} \
            --state open \
            --label "health-check" \
            --json number \
            --jq '.[].number' | \
          xargs -I{} gh issue close {} \
            --repo ${{ github.repository }} \
            --comment "✅ Health check passed — closing automatically." || true

      # ── 4. SLACK NOTIFICATION ────────────────────────────────────────────
      # Requires SLACK_BOT_TOKEN and SLACK_CHANNEL_ID repository secrets.
      # SLACK_BOT_TOKEN: a Slack bot token (xoxb-...) with chat:write scope.
      # SLACK_CHANNEL_ID: the channel or DM ID to post to (e.g. C0123456789).
      # If either secret is absent the step is skipped silently.
      - name: Notify Slack
        if: always() && secrets.SLACK_BOT_TOKEN != '' && secrets.SLACK_CHANNEL_ID != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          OVERALL: ${{ steps.collate.outputs.overall }}
          DATE: ${{ steps.collate.outputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OVERALL" = "pass" ]; then
            TEXT="✅ HEALTHY — ${DATE} — all live + static checks passed. <${RUN_URL}|View run>"
          else
            TEXT="❌ UNHEALTHY — ${DATE} — one or more checks failed. <${RUN_URL}|View run>"
          fi
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"channel\":\"${SLACK_CHANNEL_ID}\",\"text\":\"${TEXT}\"}" \
            -o /tmp/slack_resp.json
          # Surface the error in the log without failing the workflow
          cat /tmp/slack_resp.json | grep -q '"ok":true' \
            && echo "Slack notification sent." \
            || { echo "Slack API error:"; cat /tmp/slack_resp.json; }
