<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Braves"/>
  <meta name="theme-color" content="#0a0f0d"/>
  <title>Braves Dashboard</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23002B5C'/%3E%3Ctext x='90' y='115' font-size='80' text-anchor='middle' fill='%23CE1141' font-family='Arial Black'%3EA%3C/text%3E%3C/svg%3E"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Anton&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#002B5C;--red:#CE1141;--bg:#0a0f0d;--card:#0d1a0f;--card2:#0a1628;
      --green:#22c55e;--yellow:#facc15;--crimson:#ef4444;--blue:#38bdf8;
      --text:#e8ede9;--muted:#8ab4a0;--dim:#5a7a62;--border:#1e3a26;
      --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
    #app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;position:relative}
    .hdr{background:linear-gradient(135deg,var(--navy),#0a1628);border-bottom:2px solid var(--red);padding:calc(var(--safe-top) + 12px) 16px 12px;flex-shrink:0;box-shadow:0 4px 20px rgba(206,17,65,.25)}
    .hdr-row{display:flex;align-items:center;gap:12px}
    .logo{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--navy));display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:15px;color:#fff;box-shadow:0 0 16px rgba(206,17,65,.5);flex-shrink:0}
    .hdr-title{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:1.5px}
    .hdr-sub{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:1px}
    .hdr-rec{margin-left:auto;text-align:right;font-family:'Anton',sans-serif;font-size:24px;color:var(--green);text-shadow:0 0 10px rgba(34,197,94,.4);line-height:1}
    .hdr-rec-sub{font-size:9px;color:var(--muted);margin-top:2px}
    .refresh-pill{display:inline-flex;align-items:center;gap:5px;font-size:9px;color:var(--dim);background:#0a1410;border:1px solid var(--border);border-radius:20px;padding:3px 8px;margin-top:6px;cursor:pointer}
    .refresh-pill.live{color:var(--green);border-color:#22c55e44}
    .pulse{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
    .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px calc(80px + var(--safe-bottom))}
    .bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(10,15,13,.97);backdrop-filter:blur(16px);border-top:1px solid #1e3a26;display:flex;padding-bottom:var(--safe-bottom);z-index:100}
    .nbtn{flex:1;border:none;background:none;color:var(--dim);padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif}
    .nbtn.active{color:var(--green)}
    .nbtn .ni{font-size:18px;line-height:1}
    .nbtn .nl{font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
    .ct{font-size:10px;font-weight:700;letter-spacing:2px;margin-bottom:12px;text-transform:uppercase}
    .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .sb{background:#0a1410;border:1px solid #1e3a26;border-radius:10px;padding:12px 8px;text-align:center}
    .sl{font-size:9px;color:var(--dim);letter-spacing:1.5px;margin-bottom:4px;text-transform:uppercase}
    .sv{font-family:'Anton',sans-serif;font-size:26px;line-height:1}
    .ss{font-size:9px;color:var(--dim);margin-top:3px}
    .aic{background:linear-gradient(135deg,#0d1f0f,#0a1628);border:1px solid #22c55e44;border-radius:14px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
    .aic::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--red))}
    .ail{font-size:10px;color:var(--green);letter-spacing:2px;font-weight:700;margin-bottom:8px}
    .ait{font-size:14px;line-height:1.6;color:#d4edda}
    .badge{display:inline-block;padding:3px 9px;border-radius:6px;font-weight:700;font-size:13px;font-family:'JetBrains Mono',monospace}
    .bg{background:#22c55e22;color:var(--green);border:1px solid #22c55e55}
    .by{background:#facc1522;color:var(--yellow);border:1px solid #facc1555}
    .br{background:#ef444422;color:var(--crimson);border:1px solid #ef444455}
    .ph{border-radius:14px;padding:16px;margin-bottom:12px}
    .ph.bat{background:linear-gradient(135deg,#0d1f0f,#091209);border:1px solid #22c55e55}
    .ph.pit{background:linear-gradient(135deg,#1a0d14,#0d0912);border:1px solid #CE114155}
    .pn{font-family:'Anton',sans-serif;font-size:20px;margin-bottom:2px}
    .pp{font-size:11px;color:var(--muted);margin-bottom:12px}
    .ps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .psi{text-align:center}
    .psl{font-size:9px;color:var(--dim);margin-bottom:3px;letter-spacing:1px}
    .psv{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700}
    .rrow{display:flex;gap:8px}
    .rpill{flex:1;border-radius:10px;padding:12px 8px;text-align:center}
    .rpill.w{background:#22c55e15;border:1px solid #22c55e44}
    .rpill.l{background:#ef444415;border:1px solid #ef444444}
    .rd{font-size:10px;color:var(--dim);margin-bottom:3px}
    .rl{font-family:'Anton',sans-serif;font-size:22px}
    .rs{font-family:'JetBrains Mono',monospace;font-size:14px}
    .wm{display:flex;align-items:center;gap:16px;margin-bottom:14px}
    .wt{font-family:'Anton',sans-serif;font-size:48px;line-height:1;color:#fff}
    .wds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
    .wdi{font-size:12px}
    .frow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
    .frow::-webkit-scrollbar{display:none}
    .fday{flex-shrink:0;text-align:center;padding:10px;border-radius:10px;border:1px solid #1e3a46;min-width:56px;background:#0a1420}
    .fday.today{background:#38bdf822;border-color:#38bdf844}
    .fl{font-size:9px;color:var(--blue);font-weight:700;margin-bottom:3px;letter-spacing:1px}
    .fi{font-size:20px;margin-bottom:3px}
    .fh{font-family:'JetBrains Mono',monospace;font-size:13px;color:#fff}
    .fo{font-family:'JetBrains Mono',monospace;font-size:11px;color:#5a7a82}
    .fr{font-size:10px;font-weight:700;margin-top:3px}
    .abar{margin-top:10px;padding:10px 12px;border-radius:8px;background:#ef444415;border:1px solid #ef444433;font-size:12px;color:#fca5a5;line-height:1.5}
    .plist{display:flex;flex-direction:column;gap:10px}
    .prow{background:#0d1a0f;border:1px solid var(--border);border-radius:12px;padding:12px 14px}
    .ptop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .prn{font-weight:700;font-size:15px;flex:1}
    .prp{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700}
    .prp.sp{background:#002B5C44;color:#60a5fa}
    .prp.rp{background:#CE114122;color:#f87171}
    .prp.bat{background:#22c55e11;color:var(--green)}
    .prstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .pri{text-align:center}
    .pril{font-size:9px;color:var(--dim);letter-spacing:1px;margin-bottom:2px}
    .stbl{width:100%;border-collapse:collapse}
    .stbl th{font-size:10px;color:var(--dim);letter-spacing:1.5px;padding:6px 8px;text-align:center;font-weight:700}
    .stbl th:first-child{text-align:left}
    .stbl td{padding:10px 8px;border-bottom:1px solid var(--border);font-size:14px}
    .stbl td:not(:first-child){text-align:center;font-family:'JetBrains Mono',monospace}
    .stbl tr.me td:first-child{color:var(--green);font-weight:700}
    .stbl tr.me{background:#22c55e08}
    .rbrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
    .rbn{font-size:10px;color:var(--dim);width:18px;flex-shrink:0}
    .rbnm{flex:1;font-size:13px}
    .rbw{width:70px;height:5px;background:#1e3a26;border-radius:3px;overflow:hidden;flex-shrink:0}
    .rbb{height:100%;border-radius:3px}
    .rbp{font-family:'JetBrains Mono',monospace;font-size:12px;width:36px;text-align:right;flex-shrink:0}
    .mhdr{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#0d1a0f,var(--card2));border:1px solid #CE114155;border-radius:14px;padding:16px;margin-bottom:12px}
    .mvs{font-family:'Anton',sans-serif;font-size:26px}
    .gc{background:#0a1a0c;border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
    .gcn{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-family:'Anton',sans-serif;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .gcdate{font-weight:700;font-size:14px}
    .gcloc{font-size:12px;color:var(--muted);margin-top:1px}
    .gctime{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--yellow)}
    .mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center}
    .mav{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;text-align:left}
    .mlab{font-size:10px;color:var(--dim);letter-spacing:1px;text-align:center;text-transform:uppercase}
    .mbv{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;text-align:right}
    .ebox{margin-top:12px;padding:12px;border-radius:10px;background:#22c55e11;border:1px solid #22c55e33;text-align:center;font-size:13px;line-height:1.6}
    .hltbl{width:100%;border-collapse:collapse}
    .hltbl th{font-size:9px;color:var(--dim);letter-spacing:1.5px;padding:4px 4px;text-align:center;font-weight:700}
    .hltbl th:first-child{text-align:left;padding-left:8px}
    .hltbl td{padding:9px 4px;border-bottom:1px solid var(--border);font-size:13px;text-align:center;font-family:'JetBrains Mono',monospace}
    .hltbl td:first-child{text-align:left;padding-left:8px;font-family:'DM Sans',sans-serif}
    .leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin-bottom:12px}
    .leg span{display:flex;align-items:center;gap:4px}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{width:14px;height:14px;border:2px solid #22c55e44;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
    .loading-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 20px;text-align:center}
    .loading-overlay .big-spin{width:40px;height:40px;border:3px solid #22c55e22;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}
    .loading-msg{font-size:13px;color:var(--muted)}
    /* GAMES */
    .game-selector{display:flex;gap:8px;margin-bottom:16px}
    .gsb{flex:1;padding:10px 6px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;text-align:center}
    .gsb.active{background:var(--red);color:#fff;border-color:var(--red)}
    .game-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
    .game-title{font-family:'Anton',sans-serif;font-size:22px;margin-bottom:4px}
    .game-sub{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5}
    .score-row{display:flex;gap:10px;margin-bottom:14px}
    .score-box{background:#0a1410;border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:center;flex:1}
    .score-box .sl{font-size:9px;color:var(--dim);letter-spacing:1.5px;margin-bottom:3px}
    .score-box .sv{font-family:'Anton',sans-serif;font-size:24px;line-height:1}
    .game-btn{width:100%;padding:16px;border:none;border-radius:12px;font-family:'Anton',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;margin-top:8px}
    .game-btn:active{transform:scale(.97);filter:brightness(1.2)}
    .game-btn.primary{background:var(--red);color:#fff;box-shadow:0 4px 20px rgba(206,17,65,.35)}
    .game-btn.secondary{background:#1e3a26;color:var(--green);border:1px solid var(--green)}
    .result-flash{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);font-family:'Anton',sans-serif;font-size:44px;pointer-events:none;opacity:0;transition:opacity .15s;text-shadow:0 0 20px currentColor;z-index:10;white-space:nowrap}
    .result-flash.show{opacity:1}
    @keyframes shakeg{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
    .shakeg{animation:shakeg .4s ease}
    /* CAP SHUFFLE */
    .caps-arena{position:relative;height:170px;margin:10px 0;user-select:none}
    .cap{position:absolute;bottom:0;cursor:pointer;transition:left .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;align-items:center;gap:4px;-webkit-tap-highlight-color:transparent}
    .cap svg{width:68px;height:50px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));transition:transform .2s}
    .cap:active svg{transform:scale(.93)}
    .cap .cap-lbl{font-size:9px;font-weight:700;color:var(--dim);letter-spacing:1px}
    .ball-peek{font-size:18px;position:absolute;bottom:52px;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .3s;pointer-events:none}
    .cap.reveal .ball-peek{opacity:1}
    .shuffle-msg{text-align:center;font-size:13px;color:var(--muted);margin-bottom:10px;min-height:18px}
    .speed-bar{display:flex;gap:5px;align-items:center;margin-bottom:10px}
    .speed-seg{height:6px;flex:1;border-radius:3px;background:#1e3a26;transition:background .3s}
    .speed-seg.lit{background:var(--green)}
    .speed-seg.lit.fast{background:var(--yellow)}
    .speed-seg.lit.danger{background:var(--crimson)}
    /* BASERUNNING */
    #base-field{position:relative;width:100%;aspect-ratio:1;max-height:260px;background:radial-gradient(ellipse at 50% 60%,#2d5a1b 0%,#1a3a0f 60%,#0f2008 100%);border-radius:12px;overflow:hidden;margin:10px 0;user-select:none}
    .base{position:absolute;width:13%;aspect-ratio:1;background:#fff;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#000;box-shadow:0 2px 8px rgba(0,0,0,.4)}
    .base.active{background:var(--yellow);box-shadow:0 0 12px var(--yellow)}
    .base.safe{background:var(--green);box-shadow:0 0 12px var(--green)}
    #runner{position:absolute;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--navy));border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;transition:left .28s ease,top .28s ease;z-index:5;box-shadow:0 0 10px rgba(206,17,65,.5)}
    #fielder{position:absolute;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#1e3a46,#0a1628);border:2px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;transition:left .22s ease,top .22s ease;z-index:4}
    .base-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .base-btn{padding:13px;border:none;border-radius:10px;font-family:'Anton',sans-serif;font-size:15px;letter-spacing:1px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
    .base-btn:active{transform:scale(.95)}
    .base-btn.run{background:var(--green);color:#fff}
    .base-btn.slide{background:var(--yellow);color:#000}
    .base-btn.stop{background:#1e3a26;color:var(--green);border:1px solid var(--green)}
    .base-btn.home{background:var(--red);color:#fff}
    .out-indicator{display:flex;gap:6px;align-items:center;margin-bottom:8px}
    .out-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--crimson);background:transparent}
    .out-dot.lit{background:var(--crimson)}
    .base-event{text-align:center;font-size:12px;color:var(--muted);min-height:16px;margin:5px 0}
  </style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-row">
      <div class="logo">ATL</div>
      <div>
        <div class="hdr-title">BRAVES</div>
        <div class="hdr-sub">2026 · NL EAST · LIVE</div>
      </div>
      <div style="margin-left:auto;text-align:right">
        <div class="hdr-rec" id="hdr-rec">39-19</div>
        <div class="hdr-rec-sub">1ST · NL EAST · .672</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
      <div class="refresh-pill live" id="refresh-pill" onclick="refreshAll()">
        <div class="pulse"></div>
        <span id="refresh-label">Refreshing every 2 min</span>
      </div>
      <div style="font-size:9px;color:var(--dim)" id="last-updated"></div>

  </div>

  <div class="content" id="content">
    <div class="loading-overlay">
      <div class="big-spin"></div>
      <div class="loading-msg">Loading live Braves data…</div>
    </div>
  </div>

  <nav class="bnav">
    <button class="nbtn active" onclick="showTab('overview',this)"><span class="ni">🏠</span><span class="nl">Home</span></button>
    <button class="nbtn" onclick="showTab('stats',this)"><span class="ni">📈</span><span class="nl">Stats</span></button>
    <button class="nbtn" onclick="showTab('series',this)"><span class="ni">📅</span><span class="nl">Series</span></button>
    <button class="nbtn" onclick="showTab('standings',this)"><span class="ni">📊</span><span class="nl">Standings</span></button>
    <button class="nbtn" onclick="showTab('games',this)"><span class="ni">🎮</span><span class="nl">Games</span></button>
  </nav>
</div>

<script>
const MLB_BAT={avg:.248,obp:.318,slg:.413,ops:.731,hr:14,rbi:52,sb:8};
const MLB_PIT={era:4.20,whip:1.28,k9:8.8,bb9:3.2,fip:4.15};
let DATA=null, currentTab='overview', refreshTimer=null, aiInsightCache='';

const SEED={

  batters:[
    {name:'Ronald Acuña Jr.',pos:'RF',avg:.289,obp:.378,slg:.501,ops:.879,hr:12,rbi:38,sb:18},
    {name:'Matt Olson',      pos:'1B',avg:.274,obp:.368,slg:.521,ops:.889,hr:16,rbi:47,sb:1},
    {name:'Austin Riley',   pos:'3B',avg:.261,obp:.335,slg:.498,ops:.833,hr:13,rbi:41,sb:2},
    {name:'Ozzie Albies',   pos:'2B',avg:.255,obp:.316,slg:.438,ops:.754,hr:9, rbi:31,sb:6},
    {name:'Michael Harris II',pos:'CF',avg:.264,obp:.328,slg:.451,ops:.779,hr:8,rbi:29,sb:11},

function pct(w,l){return(w/(w+l)).toFixed(3).replace('0.','.')}
function gb(tw,tl,w,l){const g=((tw-w)+(l-tl))/2;return g===0?'—':g.toFixed(1)}
function rainColor(r){return r>=60?'var(--crimson)':r>=30?'var(--yellow)':'var(--green)'}
function sc(v,a,low=false){const d=low?a-v:v-a;return d>0.05*a?'var(--green)':d<-0.05*a?'var(--crimson)':'var(--yellow)'}
function badge(v,a,low,fmt){const c=sc(v,a,low);const cls=c.includes('green')?'badge bg':c.includes('crimson')?'badge br':'badge by';return`<span class="${cls}">${fmt?fmt(v):v}</span>`}
function stamp(){return new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true})}

async function refreshAll(){
  const pill=document.getElementById('refresh-pill');
  const lbl=document.getElementById('refresh-label');
  if(pill) pill.classList.remove('live');
  if(lbl) lbl.textContent='Updating…';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,
        system:'You are a sharp MLB analyst. 2 punchy sentences. No markdown.',
        messages:[{role:'user',content:`Braves 2026: 39-19, 1st NL East. Sale ERA 3.01, Acuña .289/12HR/18SB. Last game: ATL 8 CIN 3 (Fuentes W). Next: vs CIN tonight 7:15. Hot take.`}]})});
    const d=await res.json();
    aiInsightCache=d.content?.map(c=>c.text||'').join('')||aiInsightCache;
  }catch(e){}
  DATA=SEED;
  const upEl=document.getElementById('last-updated');
  if(upEl) upEl.textContent=`Updated ${stamp()}`;
  if(pill) pill.classList.add('live');
  if(lbl) lbl.textContent='Refreshing every 2 min';
  renderTab(currentTab);
  clearTimeout(refreshTimer);
  refreshTimer=setTimeout(()=>refreshAll(),2*60*1000);
}

function showTab(tab,btn){
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  currentTab=tab;
  const c=document.getElementById('content');
  c.scrollTop=0;
  stopAllGames();
  renderTab(tab);
}

function renderTab(tab){
  const d=DATA||SEED;
  if(tab==='overview')      renderOverview(d);
  else if(tab==='stats')    renderStats(d);
  else if(tab==='series')   renderSeries(d);
  else if(tab==='standings')renderStandings(d);
  else if(tab==='highlights')renderHighlights(d);
  else if(tab==='games')    renderGames();
}

      ${sorted.map((t,i)=>{const p=t.w/(t.w+t.l);return`<div class="rbrow"><span class="rbn">#${i+1}</span><span class="rbnm" style="${t.abbr==='ATL'?'color:var(--green);font-weight:700':''}">${t.abbr==='ATL'?'🪓 ':''}${t.name}</span><div class="rbw"><div class="rbb" style="width:${p*100}%;background:${t.abbr==='ATL'?'var(--green)':'#60a5fa'}"></div></div><span class="rbp" style="${t.abbr==='ATL'?'color:var(--green)':''}">${pct(t.w,t.l)}</span></div>`}).join('')}
    </div>`;
}

        <div style="text-align:center;padding:0 8px"><div style="font-family:'Anton',sans-serif;font-size:20px;color:var(--dim)">FINAL</div><div style="font-size:10px;color:var(--dim);margin-top:2px">${g.venue}</div></div>

    </div>
    <div class="card" style="padding:14px 10px;overflow-x:auto">
      <div class="ct" style="color:var(--muted);padding-left:4px">LINESCORE</div>
      <table style="width:100%;border-collapse:collapse;min-width:300px">

    </div>
    <div class="card">
      <div class="ct" style="color:var(--green)">🏏 ATL BATTING</div>
      <table class="hltbl"><thead><tr><th>PLAYER</th><th>AB</th><th>H</th><th>HR</th><th>RBI</th><th>R</th></tr></thead>
      <tbody>${g.atlBatters.map((b,i)=>`<tr style="background:${i%2===0?'#0d1a0f':'#0a140c'}"><td><div style="font-weight:700;font-size:13px">${b.name}</div>${b.note?`<div style="font-size:10px;color:var(--yellow)">${b.note}</div>`:''}</td><td style="color:var(--muted)">${b.ab}</td><td style="color:${b.h>0?'var(--green)':'var(--dim)'}">${b.h}</td><td style="color:${b.hr>0?'var(--yellow)':'var(--dim)'}">${b.hr||'—'}</td><td style="color:${b.rbi>0?'var(--green)':'var(--dim)'}">${b.rbi}</td><td style="color:${b.r>0?'var(--blue)':'var(--dim)'}">${b.r}</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="card" style="margin-bottom:24px">
      <div class="ct" style="color:var(--red)">⚾ ATL PITCHING</div>
      <table class="hltbl"><thead><tr><th>PITCHER</th><th>IP</th><th>H</th><th>ER</th><th>K</th><th>BB</th></tr></thead>
      <tbody>${g.atlPitchers.map((p,i)=>`<tr style="background:${i%2===0?'#0d1a0f':'#0a140c'}"><td><div style="font-weight:700;font-size:13px">${p.name}</div><div style="font-size:10px;color:${p.role.includes('W')?'var(--green)':'var(--dim)'}">${p.role}${p.note?' · '+p.note:''}</div></td><td style="color:var(--muted)">${p.ip}</td><td style="color:${p.h>0?'var(--yellow)':'var(--dim)'}">${p.h}</td><td style="color:${p.er>0?'var(--crimson)':'var(--green)'}">${p.er}</td><td style="color:${p.k>4?'var(--green)':p.k>0?'var(--muted)':'var(--dim)'}">${p.k}</td><td style="color:${p.bb>2?'var(--crimson)':'var(--muted)'}">${p.bb}</td></tr>`).join('')}</tbody></table>
    </div>`;
}

// ════════════════════════════════════════
// GAMES TAB
// ════════════════════════════════════════
let activeGame='shuffle';
function stopAllGames(){
  if(window._shuffleTimer){clearTimeout(window._shuffleTimer);window._shuffleTimer=null}
  if(window._baseTimer){clearInterval(window._baseTimer);window._baseTimer=null}
}

function renderGames(){
  document.getElementById('content').innerHTML=`
    <div class="game-selector">
      <button class="gsb ${activeGame==='shuffle'?'active':''}" onclick="switchGame('shuffle')">🌀 Cap Shuffle</button>
      <button class="gsb ${activeGame==='base'?'active':''}" onclick="switchGame('base')">🏃 Baserunning</button>
    </div>
    <div id="game-content"></div>`;
  if(activeGame==='shuffle') initShuffle();
  else initBase();
}

function switchGame(g){
  activeGame=g;
  stopAllGames();
  document.querySelectorAll('.gsb').forEach(b=>b.classList.remove('active'));
  const btn=document.querySelector(`.gsb:${g==='shuffle'?'first':'last'}-child`);
  if(btn) btn.classList.add('active');
  if(g==='shuffle') initShuffle();
  else initBase();
}

// ── CAP SHUFFLE ──
const CAP_SVG=()=>`<svg viewBox="0 0 80 55" xmlns="http://www.w3.org/2000/svg"><ellipse cx="40" cy="50" rx="38" ry="7" fill="rgba(0,0,0,.3)"/><path d="M8 38 Q10 15 40 14 Q70 15 72 38 Q60 42 40 43 Q20 42 8 38Z" fill="#002B5C"/><path d="M8 38 Q30 35 72 38 L72 42 Q50 46 40 46 Q20 46 8 42Z" fill="#CE1141"/><rect x="28" y="14" width="24" height="14" rx="3" fill="#002B5C"/><text x="40" y="25" font-size="9" text-anchor="middle" fill="white" font-family="Arial Black" font-weight="900">A</text><rect x="2" y="36" width="20" height="5" rx="2.5" fill="#8B6914"/></svg>`;
let SS={ballPos:0,round:0,score:0,best:0,speed:700,shuffling:false,revealed:false,locked:false};

function initShuffle(){
  SS={ballPos:Math.floor(Math.random()*3),round:0,score:0,best:parseInt(localStorage.getItem('sBest')||'0'),speed:700,shuffling:false,revealed:false,locked:false};
  document.getElementById('game-content').innerHTML=`
    <div class="game-panel" id="sh-panel">
      <div class="game-title">🌀 CAP SHUFFLE</div>
      <div class="game-sub">Watch the ball — find it after the shuffle! Gets faster every round.</div>
      <div class="score-row">
        <div class="score-box"><div class="sl">ROUND</div><div class="sv" id="sh-round" style="color:var(--yellow)">0</div></div>
        <div class="score-box"><div class="sl">SCORE</div><div class="sv" id="sh-score" style="color:var(--green)">0</div></div>
        <div class="score-box"><div class="sl">BEST</div><div class="sv" id="sh-best" style="color:var(--blue)">${SS.best}</div></div>
      </div>
      <div class="speed-bar">${[1,2,3,4,5,6,7,8].map(i=>`<div class="speed-seg" id="spd-${i}"></div>`).join('')}</div>
      <div class="shuffle-msg" id="sh-msg">Tap START — watch the ball!</div>
      <div class="caps-arena" id="caps-arena">
        ${[0,1,2].map(i=>`<div class="cap" id="cap-${i}" onclick="capTapped(${i})" style="left:${i*33+1}%;width:30%">${CAP_SVG()}<div class="ball-peek">⚾</div><div class="cap-lbl">CAP ${i+1}</div></div>`).join('')}
      </div>
      <div class="result-flash" id="sh-flash"></div>
      <button class="game-btn primary" id="sh-btn" onclick="startShuffle()">▶ START</button>
    </div>`;
  peekBall(true);
}

function peekBall(show){[0,1,2].forEach(i=>{const c=document.getElementById('cap-'+i);if(c) show&&i===SS.ballPos?c.classList.add('reveal'):c.classList.remove('reveal')})}
function updateSpeedBar(){const lv=Math.min(8,Math.floor(SS.round/2)+1);for(let i=1;i<=8;i++){const s=document.getElementById('spd-'+i);if(!s)continue;if(i<=lv){s.classList.add('lit');s.classList.toggle('fast',lv>=4);s.classList.toggle('danger',lv>=6)}else s.classList.remove('lit','fast','danger')}}

function startShuffle(){
  if(SS.shuffling) return;
  SS.round++;SS.speed=Math.max(160,700-SS.round*58);SS.shuffling=true;SS.revealed=false;SS.locked=false;
  SS.ballPos=Math.floor(Math.random()*3);
  document.getElementById('sh-round').textContent=SS.round;
  document.getElementById('sh-msg').textContent='Watch the ball…';
  document.getElementById('sh-btn').disabled=true;
  updateSpeedBar();peekBall(true);
  window._shuffleTimer=setTimeout(()=>{peekBall(false);doShuffles(0,7+SS.round*2);},950);
}

function doShuffles(done,total){
  if(done>=total){SS.shuffling=false;const m=document.getElementById('sh-msg');if(m) m.textContent='🤔 Which cap hides the ball?';return}
  const a=Math.floor(Math.random()*3);let b=a;while(b===a)b=Math.floor(Math.random()*3);
  const cA=document.getElementById('cap-'+a),cB=document.getElementById('cap-'+b);
  if(cA&&cB){const lA=cA.style.left;cA.style.left=cB.style.left;cB.style.left=lA;}
  if(SS.ballPos===a)SS.ballPos=b;else if(SS.ballPos===b)SS.ballPos=a;
  window._shuffleTimer=setTimeout(()=>doShuffles(done+1,total),SS.speed);
}

function capTapped(idx){
  if(SS.shuffling||SS.revealed||SS.locked)return;
  SS.revealed=true;SS.locked=true;peekBall(true);
  const flash=document.getElementById('sh-flash'),msg=document.getElementById('sh-msg'),btn=document.getElementById('sh-btn'),panel=document.getElementById('sh-panel');
  if(idx===SS.ballPos){
    SS.score++;if(SS.score>SS.best){SS.best=SS.score;localStorage.setItem('sBest',SS.best);}
    document.getElementById('sh-score').textContent=SS.score;document.getElementById('sh-best').textContent=SS.best;
    if(flash){flash.textContent='✅ GOT IT!';flash.style.color='var(--green)';flash.classList.add('show');}
    if(msg) msg.textContent=`Round ${SS.round} — correct! 🪓`;
    window._shuffleTimer=setTimeout(()=>{if(flash)flash.classList.remove('show');if(btn){btn.disabled=false;btn.textContent='▶ NEXT ROUND';}},900);
  }else{
    if(flash){flash.textContent='❌ WRONG!';flash.style.color='var(--crimson)';flash.classList.add('show');}
    if(panel){panel.classList.add('shakeg');setTimeout(()=>panel.classList.remove('shakeg'),400);}
    if(msg) msg.textContent=`Ball was under Cap ${SS.ballPos+1}. Score: ${SS.score}`;
    window._shuffleTimer=setTimeout(()=>{if(flash)flash.classList.remove('show');initShuffle();},1600);
  }
}

// ── BASERUNNING DASH ──
const BP=[{name:'Home',x:50,y:86},{name:'1B',x:81,y:55},{name:'2B',x:50,y:24},{name:'3B',x:19,y:55}];
let BS={runnerBase:0,outs:0,score:0,sliding:false,gameOver:false,best:0,fielder:{x:75,y:35}};

function initBase(){
  BS={runnerBase:0,outs:0,score:0,sliding:false,gameOver:false,best:parseInt(localStorage.getItem('bBest')||'0'),fielder:{x:75,y:35}};
  document.getElementById('game-content').innerHTML=`
    <div class="game-panel">
      <div class="game-title">🏃 BASERUNNING DASH</div>
      <div class="game-sub">RUN to advance bases · SLIDE to avoid the tag · HOLD to stay safe · Score by reaching HOME!</div>
      <div class="score-row">
        <div class="score-box"><div class="sl">RUNS</div><div class="sv" id="b-score" style="color:var(--green)">0</div></div>
        <div class="score-box"><div class="sl">OUTS</div><div class="sv" id="b-outs" style="color:var(--crimson)">0</div></div>
        <div class="score-box"><div class="sl">BEST</div><div class="sv" id="b-best" style="color:var(--blue)">${BS.best}</div></div>
      </div>
      <div class="out-indicator">${[0,1,2].map(i=>`<div class="out-dot" id="od-${i}"></div>`).join('')}<span style="font-size:10px;color:var(--dim);margin-left:4px">3 outs = inning over</span></div>
      <div id="base-field">
        <div style="position:absolute;width:52%;aspect-ratio:1;top:50%;left:50%;transform:translate(-50%,-55%) rotate(45deg)">
          ${[{l:'43%',t:'86%',n:'H'},{l:'86%',t:'43%',n:'1'},{l:'43%',t:'0%',n:'2'},{l:'0%',t:'43%',n:'3'}].map((b,i)=>`<div class="base" id="base-${i}" style="left:${b.l};top:${b.t}">${b.n}</div>`).join('')}
        </div>
        <div id="runner" style="left:${BP[0].x-3.5}%;top:${BP[0].y-4}%">🏃</div>
        <div id="fielder" style="left:${BS.fielder.x-3}%;top:${BS.fielder.y-3}%">🧤</div>
      </div>
      <div class="base-event" id="b-evt">Ball in play — make your move!</div>
      <div class="base-actions">
        <button class="base-btn run"   onclick="baseAct('run')">🏃 RUN</button>
        <button class="base-btn slide" onclick="baseAct('slide')">💨 SLIDE</button>
        <button class="base-btn stop"  onclick="baseAct('stop')">✋ HOLD</button>
        <button class="base-btn home"  onclick="baseAct('home')">🏠 SCORE!</button>
      </div>
    </div>`;
  updateBases();scheduleFielder();
}

function updateBases(){BP.forEach((_,i)=>{const el=document.getElementById('base-'+i);if(el){el.className='base'+(i===BS.runnerBase?' safe':i===(BS.runnerBase+1)%4?' active':'');}})}

function scheduleFielder(){
  if(window._baseTimer)clearInterval(window._baseTimer);
  window._baseTimer=setInterval(()=>{
    if(BS.gameOver)return;
    const t=BP[BS.runnerBase];const dx=t.x-BS.fielder.x;const dy=t.y-BS.fielder.y;
    const dist=Math.sqrt(dx*dx+dy*dy);const spd=1.6+BS.score*0.18;
    if(dist>2){BS.fielder.x+=dx/dist*spd;BS.fielder.y+=dy/dist*spd;const f=document.getElementById('fielder');if(f){f.style.left=(BS.fielder.x-3)+'%';f.style.top=(BS.fielder.y-3)+'%';}if(dist<8&&!BS.sliding)recordOut('Tagged out at '+BP[BS.runnerBase].name+'! 🧤');}
  },80);
}

function baseAct(act){
  if(BS.gameOver)return;
  const next=(BS.runnerBase+1)%4;const evt=document.getElementById('b-evt');
  if(act==='run'||act==='home'){
    const dest=act==='home'?0:next;BS.runnerBase=dest;BS.sliding=false;
    BS.fielder={x:72+Math.random()*18,y:18+Math.random()*22};
    const r=document.getElementById('runner');if(r){r.style.left=(BP[dest].x-3.5)+'%';r.style.top=(BP[dest].y-4)+'%';}
    const f=document.getElementById('fielder');if(f){f.style.left=BS.fielder.x+'%';f.style.top=BS.fielder.y+'%';}
    if(dest===0&&act==='home'){BS.score++;if(BS.score>BS.best){BS.best=BS.score;localStorage.setItem('bBest',BS.best);}document.getElementById('b-score').textContent=BS.score;document.getElementById('b-best').textContent=BS.best;if(evt)evt.textContent='🏠 RUN SCORES! +1';}
    else{if(evt)evt.textContent=`Safe at ${BP[dest].name}!`;}
    updateBases();
  }else if(act==='slide'){BS.sliding=true;if(evt)evt.textContent='💨 Sliding — no tag for 2 seconds!';setTimeout(()=>{BS.sliding=false;},2000);}
  else if(act==='stop'){BS.fielder={x:72+Math.random()*18,y:18+Math.random()*22};if(evt)evt.textContent=`Holding at ${BP[BS.runnerBase].name} — safe!`;}
}

function recordOut(msg){
  BS.outs++;const od=document.getElementById('od-'+(BS.outs-1));if(od)od.classList.add('lit');
  document.getElementById('b-outs').textContent=BS.outs;
  const evt=document.getElementById('b-evt');if(evt)evt.textContent=msg;
  BS.fielder={x:72+Math.random()*18,y:18+Math.random()*22};BS.runnerBase=0;BS.sliding=false;
  const r=document.getElementById('runner');if(r){r.style.left=(BP[0].x-3.5)+'%';r.style.top=(BP[0].y-4)+'%';}
  updateBases();
  if(BS.outs>=3){
    BS.gameOver=true;clearInterval(window._baseTimer);
    setTimeout(()=>{
      const gc=document.getElementById('game-content');
      if(gc)gc.innerHTML+=`<div class="card" style="margin-top:8px;text-align:center;border-color:#22c55e44">
        <div style="font-family:'Anton',sans-serif;font-size:24px;color:var(--green);margin-bottom:6px">INNING OVER</div>
        <div style="font-size:14px;color:var(--muted);margin-bottom:14px">You scored <strong style="color:var(--green)">${BS.score} run${BS.score!==1?'s':''}</strong> this inning · Best: ${BS.best}</div>
        <button class="game-btn primary" onclick="switchGame('base')">▶ PLAY AGAIN</button>
      </div>`;
    },800);
  }
}

DATA=SEED;
refreshAll();
