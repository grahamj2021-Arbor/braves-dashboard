<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Braves"/>
  <meta name="theme-color" content="#0a0f0d"/>
  <title>Braves Dashboard</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="braves-icon.png"/>
  <link rel="icon" type="image/png" href="braves-icon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Anton&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#002B5C;--red:#CE1141;--bg:#0a0f0d;--card:#0d1a0f;--card2:#0a1628;
      --green:#22c55e;--yellow:#facc15;--crimson:#ef4444;--blue:#38bdf8;
      --text:#e8ede9;--muted:#8ab4a0;--dim:#5a7a62;--border:#1e3a26;
      --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
    }
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
    #app{display:flex;flex-direction:column;min-height:100dvh;margin:0 auto;position:relative;width:100%}
    /* ── DESKTOP HERO BANNER ── */
    .hero-banner{width:100%;display:block;background:#000;line-height:0;border-bottom:2px solid var(--red)}
    .hero-banner img{display:block;width:100%;height:auto;max-height:130px;object-fit:cover;object-position:center center}
    .hdr-inner{max-width:1400px;margin:0 auto;width:100%}
    .hdr{background:linear-gradient(135deg,var(--navy),#0a1628);border-bottom:2px solid var(--red);padding:calc(var(--safe-top) + 8px) 16px 8px;flex-shrink:0;box-shadow:0 4px 20px rgba(206,17,65,.25)}
    .hdr-row{display:flex;align-items:center;gap:12px}
    .logo{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--navy));display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:15px;color:#fff;box-shadow:0 0 16px rgba(206,17,65,.5);flex-shrink:0}
    .hdr-title{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:1.5px}
    .hdr-sub{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:1px}
    .hdr-rec{margin-left:auto;text-align:right;font-family:'Anton',sans-serif;font-size:24px;color:var(--green);text-shadow:0 0 10px rgba(34,197,94,.4);line-height:1}
    .hdr-rec-sub{font-size:9px;color:var(--muted);margin-top:2px}
    .refresh-pill{display:inline-flex;align-items:center;gap:5px;font-size:9px;color:var(--dim);background:#0a1410;border:1px solid var(--border);border-radius:20px;padding:3px 8px;margin-top:6px;cursor:pointer}
    .refresh-pill.live{color:var(--green);border-color:#22c55e44}
    .pulse{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
    .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px calc(80px + var(--safe-bottom));max-width:1400px;margin:0 auto;width:100%}
    .bnav{position:fixed;bottom:0;left:0;right:0;width:100%;background:rgba(10,15,13,.97);backdrop-filter:blur(16px);border-top:1px solid #1e3a26;display:flex;padding-bottom:var(--safe-bottom);z-index:100;justify-content:center}
    .bnav-inner{display:flex;width:100%;max-width:1400px}
    /* ── DESKTOP RESPONSIVE LAYOUT ── */
    @media (min-width:900px){
      .content{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;padding:24px 32px 110px;align-content:start}
      .content > *{margin-bottom:0}
      .loading-overlay{grid-column:1 / -1}
      .bnav-inner .nbtn{flex:0 1 220px;flex-direction:row;gap:10px;padding:14px 18px}
      .bnav-inner .nbtn .ni{font-size:20px}
      .bnav-inner .nbtn .nl{font-size:11px}
      .hero-banner img{max-height:160px}
    }
    @media (min-width:1280px){
      .content{grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px;padding:32px 48px 110px}
      .hero-banner img{max-height:180px}
    }
    /* On mobile browser, show a slimmer hero crop */
    @media (max-width:899px){
      .hero-banner img{max-height:80px;object-position:center center}
    }
    /* ── STATS TAB: batting + pitching side-by-side on desktop ── */
    @media (min-width:900px){
      #content[data-tab="stats"]{grid-template-columns:repeat(2,minmax(0,1fr))}
      #content[data-tab="stats"] > .leg{grid-column:1 / -1}
    }
    /* ── STANDALONE PWA (iPhone home-screen app) ── */
    /* Lock to mobile-app feel: no hero image, fixed 480px column, fixed bottom nav */
    @media all and (display-mode:standalone){
      #app{max-width:480px;height:100dvh}
      .hero-banner{display:none}
      .content{display:block;max-width:none;padding:14px 12px calc(80px + var(--safe-bottom))}
      .content > *{margin-bottom:12px}
      .bnav{left:50%;right:auto;transform:translateX(-50%);max-width:480px}
      .bnav-inner{max-width:480px}
      .bnav-inner .nbtn{flex:1;flex-direction:column;gap:3px;padding:10px 4px 8px}
      .bnav-inner .nbtn .ni{font-size:18px}
      .bnav-inner .nbtn .nl{font-size:8px}
    }
    .nbtn{flex:1;border:none;background:none;color:var(--dim);padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif}
    .nbtn.active{color:var(--green)}
    .nbtn .ni{font-size:18px;line-height:1}
    .nbtn .nl{font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
    .ct{font-size:10px;font-weight:700;letter-spacing:2px;margin-bottom:12px;text-transform:uppercase}
    .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .sb{background:#0a1410;border:1px solid #1e3a26;border-radius:10px;padding:12px 8px;text-align:center}
    .sl{font-size:9px;color:var(--dim);letter-spacing:1.5px;margin-bottom:4px;text-transform:uppercase}
    .sv{font-family:'Anton',sans-serif;font-size:26px;line-height:1}
    .ss{font-size:9px;color:var(--dim);margin-top:3px}
    .aic{background:linear-gradient(135deg,#0d1f0f,#0a1628);border:1px solid #22c55e44;border-radius:14px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
    .aic::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--red))}
    .ail{font-size:10px;color:var(--green);letter-spacing:2px;font-weight:700;margin-bottom:8px}
    .ait{font-size:14px;line-height:1.6;color:#d4edda}
    .badge{display:inline-block;padding:3px 9px;border-radius:6px;font-weight:700;font-size:13px;font-family:'JetBrains Mono',monospace}
    .bg{background:#22c55e22;color:var(--green);border:1px solid #22c55e55}
    .by{background:#facc1522;color:var(--yellow);border:1px solid #facc1555}
    .br{background:#ef444422;color:var(--crimson);border:1px solid #ef444455}
    .ph{border-radius:14px;padding:16px;margin-bottom:12px}
    .ph.bat{background:linear-gradient(135deg,#0d1f0f,#091209);border:1px solid #22c55e55}
    .ph.pit{background:linear-gradient(135deg,#1a0d14,#0d0912);border:1px solid #CE114155}
    .pn{font-family:'Anton',sans-serif;font-size:20px;margin-bottom:2px}
    .pp{font-size:11px;color:var(--muted);margin-bottom:12px}
    .ps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .psi{text-align:center}
    .psl{font-size:9px;color:var(--dim);margin-bottom:3px;letter-spacing:1px}
    .psv{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700}
    .rrow{display:flex;gap:8px}
    .rpill{flex:1;border-radius:10px;padding:12px 8px;text-align:center}
    .rpill.w{background:#22c55e15;border:1px solid #22c55e44}
    .rpill.l{background:#ef444415;border:1px solid #ef444444}
    .rd{font-size:10px;color:var(--dim);margin-bottom:3px}
    .rl{font-family:'Anton',sans-serif;font-size:22px}
    .rs{font-family:'JetBrains Mono',monospace;font-size:14px}
    .wm{display:flex;align-items:center;gap:16px;margin-bottom:14px}
    .wt{font-family:'Anton',sans-serif;font-size:48px;line-height:1;color:#fff}
    .wds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
    .wdi{font-size:12px}
    .frow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
    .frow::-webkit-scrollbar{display:none}
    .fday{flex-shrink:0;text-align:center;padding:10px;border-radius:10px;border:1px solid #1e3a46;min-width:56px;background:#0a1420}
    .fday.today{background:#38bdf822;border-color:#38bdf844}
    .fl{font-size:9px;color:var(--blue);font-weight:700;margin-bottom:3px;letter-spacing:1px}
    .fi{font-size:20px;margin-bottom:3px}
    .fh{font-family:'JetBrains Mono',monospace;font-size:13px;color:#fff}
    .fo{font-family:'JetBrains Mono',monospace;font-size:11px;color:#5a7a82}
    .fr{font-size:10px;font-weight:700;margin-top:3px}
    .abar{margin-top:10px;padding:10px 12px;border-radius:8px;background:#ef444415;border:1px solid #ef444433;font-size:12px;color:#fca5a5;line-height:1.5}
    .plist{display:flex;flex-direction:column;gap:10px}
    .prow{background:#0d1a0f;border:1px solid var(--border);border-radius:12px;padding:12px 14px}
    .ptop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .prn{font-weight:700;font-size:15px;flex:1}
    .prp{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700}
    .prp.sp{background:#002B5C44;color:#60a5fa}
    .prp.rp{background:#CE114122;color:#f87171}
    .prp.bat{background:#22c55e11;color:var(--green)}
    .prstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .pri{text-align:center}
    .pril{font-size:9px;color:var(--dim);letter-spacing:1px;margin-bottom:2px}
    .stbl{width:100%;border-collapse:collapse}
    .stbl th{font-size:10px;color:var(--dim);letter-spacing:1.5px;padding:6px 8px;text-align:center;font-weight:700}
    .stbl th:first-child{text-align:left}
    .stbl td{padding:10px 8px;border-bottom:1px solid var(--border);font-size:14px}
    .stbl td:not(:first-child){text-align:center;font-family:'JetBrains Mono',monospace}
    .stbl tr.me td:first-child{color:var(--green);font-weight:700}
    .stbl tr.me{background:#22c55e08}
    .rbrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
    .rbn{font-size:10px;color:var(--dim);width:18px;flex-shrink:0}
    .rbnm{flex:1;font-size:13px}
    .rbw{width:70px;height:5px;background:#1e3a26;border-radius:3px;overflow:hidden;flex-shrink:0}
    .rbb{height:100%;border-radius:3px}
    .rbp{font-family:'JetBrains Mono',monospace;font-size:12px;width:36px;text-align:right;flex-shrink:0}
    .mhdr{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#0d1a0f,var(--card2));border:1px solid #CE114155;border-radius:14px;padding:16px;margin-bottom:12px}
    .mvs{font-family:'Anton',sans-serif;font-size:26px}
    .gc{background:#0a1a0c;border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
    .gcn{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-family:'Anton',sans-serif;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .gcdate{font-weight:700;font-size:14px}
    .gcloc{font-size:12px;color:var(--muted);margin-top:1px}
    .gctime{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--yellow)}
    .mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center}
    .mav{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;text-align:left}
    .mlab{font-size:10px;color:var(--dim);letter-spacing:1px;text-align:center;text-transform:uppercase}
    .mbv{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;text-align:right}
    .ebox{margin-top:12px;padding:12px;border-radius:10px;background:#22c55e11;border:1px solid #22c55e33;text-align:center;font-size:13px;line-height:1.6}
    .hltbl{width:100%;border-collapse:collapse}
    .hltbl th{font-size:9px;color:var(--dim);letter-spacing:1.5px;padding:4px 4px;text-align:center;font-weight:700}
    .hltbl th:first-child{text-align:left;padding-left:8px}
    .hltbl td{padding:9px 4px;border-bottom:1px solid var(--border);font-size:13px;text-align:center;font-family:'JetBrains Mono',monospace}
    .hltbl td:first-child{text-align:left;padding-left:8px;font-family:'DM Sans',sans-serif}
    .leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin-bottom:12px}
    .leg span{display:flex;align-items:center;gap:4px}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{width:14px;height:14px;border:2px solid #22c55e44;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
    .loading-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 20px;text-align:center}
    .loading-overlay .big-spin{width:40px;height:40px;border:3px solid #22c55e22;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}
    .loading-msg{font-size:13px;color:var(--muted)}
    /* CHOP BOT */
    .cb-hero{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;position:relative}
    .cb-glow{position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(206,17,65,.12) 0%,rgba(0,43,92,.1) 45%,transparent 70%);top:0;left:50%;transform:translateX(-50%);pointer-events:none}
    .cb-name{font-family:'Anton',sans-serif;font-size:26px;color:var(--green);letter-spacing:3px;text-shadow:0 0 14px rgba(34,197,94,.4);margin-top:4px}
    .cb-status-bar{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);margin-bottom:10px;letter-spacing:1px}
    .cb-sdot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite;flex-shrink:0}
    /* Character base */
    #cb-bot{animation:cb-float 3.2s ease-in-out infinite;display:block}
    #cb-bot.talking{animation:cb-talkbob .28s ease-in-out infinite}
    #cb-bot.happy{animation:cb-bounce .6s ease-in-out 2}
    #cb-bot.happy #cb-teeth{opacity:.8!important}
    #cb-bot.thinking #cb-brow-l,#cb-bot.thinking #cb-brow-r{animation:cb-browup .9s ease-in-out infinite}
    #cb-bot.thinking .cb-pupil{animation:cb-think .9s ease-in-out infinite}
    .cb-lid{transform:scaleY(0);transform-box:fill-box;transform-origin:center;transition:transform .08s}
    #cb-bot.blink .cb-lid{transform:scaleY(1)}
    .cb-pupil{transform-box:fill-box;transform-origin:center}
    /* Base keyframes */
    @keyframes cb-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes cb-talkbob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-4px) rotate(1.2deg)}}
    @keyframes cb-bounce{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-22px) scale(1.04,.96)}55%{transform:translateY(-9px) scale(.98,1.02)}75%{transform:translateY(-16px) scale(1.02)}}
    @keyframes cb-browup{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes cb-think{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,-3px)}}
    /* SCORE PREDICTOR */
    .pred-card{background:linear-gradient(135deg,#0d1a0f,#0a1628);border:1px solid #22c55e44;border-radius:14px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
    .pred-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--red))}
    .pred-pickers{display:flex;justify-content:center;align-items:flex-start;gap:28px;margin-bottom:18px}
    .pred-team{display:flex;flex-direction:column;align-items:center;gap:6px}
    .pred-team-lbl{font-size:10px;color:var(--muted);letter-spacing:2px;font-weight:700}
    .pred-adj{width:52px;height:40px;border:1px solid var(--border);border-radius:8px;background:#0a1410;color:var(--text);font-size:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .1s;display:flex;align-items:center;justify-content:center}
    .pred-adj:active{background:var(--navy)}
    .pred-num{font-family:'Anton',sans-serif;font-size:56px;color:#fff;line-height:1;width:72px;text-align:center}
    .pred-lock-btn{width:100%;padding:16px;border:none;border-radius:12px;background:var(--red);color:#fff;font-family:'Anton',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s}
    .pred-lock-btn:active{transform:scale(.97)}
    .pred-locked{background:#0a1410;border:1px solid #22c55e55;border-radius:10px;padding:12px 14px;text-align:center;font-size:14px;color:var(--green)}
    .pred-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
    .pred-row:last-child{border-bottom:none}
    .pred-badge{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700}
    .pred-badge.exact{background:#22c55e22;color:var(--green);border:1px solid #22c55e55}
    .pred-badge.close{background:#facc1522;color:var(--yellow);border:1px solid #facc1555}
    .pred-badge.winner{background:#38bdf822;color:var(--blue);border:1px solid #38bdf855}
    .pred-badge.miss{background:#ef444422;color:var(--crimson);border:1px solid #ef444455}
    .pred-badge.pending{background:#1e3a2622;color:var(--dim);border:1px solid var(--border)}
    /* Suggestions */
    .csugg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .csugg-btn{background:#0a1410;border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:11px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;font-family:'DM Sans',sans-serif;white-space:nowrap}
    .csugg-btn:active{background:var(--navy);color:var(--text);border-color:var(--blue)}
    /* Chat */
    .chat-area{background:var(--card);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
    .chat-msgs{overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px 12px;min-height:180px;max-height:340px;-webkit-overflow-scrolling:touch}
    .chat-msgs::-webkit-scrollbar{display:none}
    .cmsg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
    .cmsg.user{align-self:flex-end;flex-direction:row-reverse}
    .cmsg.bot{align-self:flex-start}
    .cbubble{padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.6;word-break:break-word}
    .cmsg.user .cbubble{background:var(--red);color:#fff;border-bottom-right-radius:4px}
    .cmsg.bot .cbubble{background:#0d1a14;border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px}
    .cavy{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--red));display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
    .ctyping{display:flex;gap:4px;align-items:center;padding:2px 0}
    .ctyping span{width:7px;height:7px;border-radius:50%;background:var(--green);animation:ctype 1s ease-in-out infinite}
    .ctyping span:nth-child(2){animation-delay:.2s}
    .ctyping span:nth-child(3){animation-delay:.4s}
    @keyframes ctype{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
    .chat-irow{border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;background:#0a1410}
    .cinput{flex:1;background:#0d1a0f;border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;resize:none;line-height:1.3;min-height:44px;max-height:88px}
    .cinput:focus{border-color:#22c55e55}

const HEALTH=(()=>{
  const KEY='braves_hlog';
  let log=[];
  let st={calls:0,errs:0,fixes:0,warns:0,start:Date.now(),lastSync:null,lastSyncPlayers:0};
  let status='green';
  try{log=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}

  function _dot(){const d=document.getElementById('health-dot');if(d){d.className=status}}
  function _save(){try{localStorage.setItem(KEY,JSON.stringify(log.slice(0,150)))}catch(e){}}

  function _add(icon,type,msg){
    log.unshift({icon,type,msg,ts:Date.now(),t:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit'})});
    if(log.length>200)log=log.slice(0,200);
    _save();_dot();
  }

  function fix(msg){st.fixes++;if(status==='red')status='yellow';_add('🔧','fix',msg);}
  function warn(msg){st.warns++;if(status==='green')status='yellow';_add('⚠️','warn',msg);}
  function err(msg){st.errs++;status='red';_add('❌','err',msg);}
  function ok(msg,players=0){st.lastSync=Date.now();st.lastSyncPlayers=players;if(status!=='red')status='green';_add('✅','ok',msg);_dot();}
  function info(msg){_add('ℹ️','info',msg);}

  async function safeFetch(url,retries=3){
    st.calls++;
    const label=url.split('?')[0].split('/').slice(-2).join('/');
    for(let i=0;i<retries;i++){
      try{
        const ctrl=typeof AbortController!=='undefined'?new AbortController():null;
        const tid=ctrl?setTimeout(()=>ctrl.abort(),8000):null;
        const res=await fetch(url,ctrl?{signal:ctrl.signal}:{});
        if(tid)clearTimeout(tid);
        if(!res.ok)throw new Error(`HTTP ${res.status}`);
        return res;
      }catch(e){
        if(i<retries-1){
          const wait=(i+1)*900;
          fix(`Retry ${i+1}/${retries-1} for ${label} (${e.message}) — waiting ${wait}ms`);
          await new Promise(r=>setTimeout(r,wait));
        }else{
          err(`${label} failed after ${retries} attempts: ${e.message}`);
          throw e;
        }
      }
    }
  }

  function safeRender(name,fn){
    try{fn();}catch(e){
      fix(`Render crash in "${name}": ${e.message} — showing recovery UI`);
      const c=document.getElementById('content');
      if(c)c.innerHTML=`<div class="card" style="text-align:center;border-color:var(--crimson);margin-top:20px">
        <div style="color:var(--crimson);margin-bottom:12px;font-size:13px">⚠️ "${name}" tab crashed and was recovered</div>
        <button onclick="renderTab(currentTab)" style="padding:10px 24px;border:1px solid var(--green);border-radius:8px;background:none;color:var(--green);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer">↺ Reload Tab</button>
      </div>`;
    }
  }

  function uptime(){
    const ms=Date.now()-st.start;
    const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);
    return h?`${h}h ${m}m`:m?`${m}m ${s}s`:`${s}s`;
  }

  function getLog(){return log;}
  function getSt(){return{...st,status};}
  function clearLog(){log=[];_save();fix('Health log cleared manually');}

  return{fix,warn,err,ok,info,safeFetch,safeRender,uptime,getLog,getSt,clearLog};
})();

function pct(w,l){return(w/(w+l)).toFixed(3).replace('0.','.')}
function gb(tw,tl,w,l){const g=((tw-w)+(l-tl))/2;return g===0?'—':g.toFixed(1)}
function rainColor(r){return r>=60?'var(--crimson)':r>=30?'var(--yellow)':'var(--green)'}
function sc(v,a,low=false){const d=low?a-v:v-a;return d>0.05*a?'var(--green)':d<-0.05*a?'var(--crimson)':'var(--yellow)'}
function badge(v,a,low,fmt){const c=sc(v,a,low);const cls=c.includes('green')?'badge bg':c.includes('crimson')?'badge br':'badge by';return`<span class="${cls}">${fmt?fmt(v):v}</span>`}
function stamp(){return new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true})}

// ── MLB LIVE DATA ──
const ATL_ID=144, NLE_DIV=204;
function _pad(n){return String(n).padStart(2,'0')}
function _fmtDate(d){return`${d.getFullYear()}-${_pad(d.getMonth()+1)}-${_pad(d.getDate())}`}
function _shortDate(s){const[,m,d]=s.split('-');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m)-1]+' '+parseInt(d)}
function _longDate(s){return new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'})}
function _dayLabel(s){return new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function _gameTime(iso){if(!iso)return'TBD';try{return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'America/New_York'})+' EDT'}catch(e){return'TBD'}}
// ── Weather helpers (WMO codes → emoji/description) ──
function _wmoDesc(code){
  const c=code||0;
  if(c===0)return{emoji:'☀️',condition:'Clear'};
  if(c<=2)return{emoji:'🌤️',condition:'Mostly Clear'};
  if(c===3)return{emoji:'⛅',condition:'Partly Cloudy'};
  if(c<=48)return{emoji:'🌫️',condition:'Foggy'};
  if(c<=55)return{emoji:'🌦️',condition:'Drizzle'};
  if(c<=65)return{emoji:'🌧️',condition:'Rain'};
  if(c<=77)return{emoji:'❄️',condition:'Snow'};
  if(c<=82)return{emoji:'🌦️',condition:'Showers'};
  return{emoji:'⛈️',condition:'Thunderstorm'};
}
function _windDir(deg){return['N','NE','E','SE','S','SW','W','NW'][Math.round((deg||0)/45)%8];}

async function fetchLiveData(){
  const season=new Date().getFullYear();
  const today=new Date();
  const start=_fmtDate(new Date(+today-14*864e5));
  const end=_fmtDate(new Date(+today+7*864e5));
  const base=`https://statsapi.mlb.com/api/v1`;
  const espnBase=`https://site.api.espn.com/apis/site/v2/sports/baseball/mlb`;
  // Truist Park, Atlanta
  const LAT=33.891, LON=-84.468;

  // First parallel wave: primary data sources
  const [sr,gr,br,pr,rr,er,wr]=await Promise.all([
    HEALTH.safeFetch(`${base}/standings?leagueId=104&season=${season}&standingsTypes=regularSeason&hydrate=team,records`),
    HEALTH.safeFetch(`${base}/schedule?sportId=1&teamId=${ATL_ID}&startDate=${start}&endDate=${end}&hydrate=linescore,team,decisions`),
    HEALTH.safeFetch(`${base}/stats?stats=season&group=hitting&season=${season}&teamId=${ATL_ID}&playerPool=All&limit=60&sportId=1&gameType=R`).catch(()=>null),
    HEALTH.safeFetch(`${base}/stats?stats=season&group=pitching&season=${season}&teamId=${ATL_ID}&playerPool=All&limit=60&sportId=1&gameType=R`).catch(()=>null),
    HEALTH.safeFetch(`${base}/teams/${ATL_ID}/roster?rosterType=active&season=${season}`).catch(()=>null),
    HEALTH.safeFetch(`${espnBase}/teams/15?enable=roster,stats`).catch(()=>null),
    HEALTH.safeFetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation_probability,wind_speed_10m,wind_direction_10m,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&forecast_days=5&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=America%2FNew_York`).catch(()=>null)
  ]);

  // Parse schedule early so we can find last game ID for boxscore fetch
  const scheduleJ=await gr.json();
  let lastGamePk=null;
  for(const day of scheduleJ.dates||[]){
    for(const g of day.games||[]){
      if(g.status?.abstractGameState==='Final') lastGamePk=g.gamePk;
    }
  }

  // Second parallel wave: remaining JSON + boxscore for last game
  const [standingsJ,battingJ,pitchingJ,rosterJ,espnJ,weatherJ,boxscoreJ]=await Promise.all([
    sr.json(),
    br?br.json():Promise.resolve(null),
    pr?pr.json():Promise.resolve(null),
    rr?rr.json():Promise.resolve(null),
    er?er.json().catch(()=>null):Promise.resolve(null),
    wr?wr.json().catch(()=>null):Promise.resolve(null),
    lastGamePk?HEALTH.safeFetch(`${base}/game/${lastGamePk}/boxscore`).then(r=>r.json()).catch(()=>null):Promise.resolve(null)
  ]);

  return{
    standings:standingsJ,
    schedule:scheduleJ,
    batting:battingJ,
    pitching:pitchingJ,
    roster:rosterJ,
    espn:espnJ,
    weather:weatherJ,
    boxscore:boxscoreJ
  };
}

  const d=JSON.parse(JSON.stringify(seed));
  // ── Standings ──
  const allTeams=[];
  for(const div of live.standings.records||[]){
    const isNLE=div.division?.id===NLE_DIV;
    const divTeams=[];
    for(const tr of div.teamRecords||[]){
      const abbr=tr.team.abbreviation||tr.team.name.split(' ').pop().slice(0,3).toUpperCase();
      const rec={name:tr.team.name,abbr,w:tr.wins,l:tr.losses};
      allTeams.push(rec);
      if(isNLE) divTeams.push(rec);
      if(tr.team.id===ATL_ID){
        d.record.w=tr.wins; d.record.l=tr.losses;
        d.record.pct=tr.winningPercentage||pct(tr.wins,tr.losses);
        const splits=tr.records?.splitRecords||[];
        const hm=splits.find(s=>s.type==='home');
        const aw=splits.find(s=>s.type==='away');
        const l10=splits.find(s=>s.type==='lastTen');
        if(hm) d.record.home=`${hm.wins}-${hm.losses}`;
        if(aw) d.record.away=`${aw.wins}-${aw.losses}`;
        if(l10) d.record.last10=`${l10.wins}-${l10.losses}`;
        const diff=(tr.runsScored||0)-(tr.runsAllowed||0);
        if(diff!==0) d.record.runDiff=diff>=0?`+${diff}`:`${diff}`;
        // keep matchup record row live
        d.matchup[0].atl=`${tr.wins}-${tr.losses} (${tr.winningPercentage||pct(tr.wins,tr.losses)})`;
        d.matchup[3].atl=d.record.runDiff;
      }
    }
    if(isNLE&&divTeams.length){
      divTeams.sort((a,b)=>(b.w/(b.w+b.l))-(a.w/(a.w+a.l)));
      d.nle=divTeams;
    }
  }
  if(allTeams.length){
    d.mlbTop=[...allTeams].sort((a,b)=>(b.w/(b.w+b.l))-(a.w/(a.w+a.l))).slice(0,8);
  }
  // ── Schedule ──
  const completed=[],upcoming=[];
  let _lastSchedGame=null;
  for(const day of live.schedule.dates||[]){
    for(const g of day.games||[]){
      const isHome=g.teams?.home?.team?.id===ATL_ID;
      const atlT=isHome?g.teams.home:g.teams.away;
      const oppT=isHome?g.teams.away:g.teams.home;
      const state=g.status?.abstractGameState;
      if(state==='Final'){
        const ar=atlT.score??0,or=oppT.score??0;
        completed.push({date:day.date,opp:oppT.team.abbreviation,r:ar>or?'W':'L',
          score:`${ar}-${or}`,isHome,atlRuns:ar,oppRuns:or,venue:g.venue?.name,gameDate:g.gameDate});
        _lastSchedGame=g; // capture full game object for linescore/decisions
      }else if(state==='Preview'||state==='Scheduled'||state==='Pre-Game'){
        upcoming.push({date:day.date,opp:oppT.team.abbreviation,isHome,venue:g.venue?.name,gameDate:g.gameDate});
      }
    }
  }
  completed.sort((a,b)=>a.date.localeCompare(b.date));
  upcoming.sort((a,b)=>a.date.localeCompare(b.date));
  if(completed.length){
    // Store last 10 for predictor settlement — keep ISO date for reliable matching
    d.completedGames=completed.slice(-10).map(g=>({isoDate:g.date,opp:g.opp,r:g.r,score:g.score}));
    d.lastGame.recentResults=completed.slice(-5).map(g=>({date:_shortDate(g.date),opp:g.opp,r:g.r,score:g.score}));
    const lg=completed[completed.length-1];
    d.lastGame.date=_longDate(lg.date);
    if(lg.isHome){d.lastGame.home={...d.lastGame.home,abbr:'ATL',runs:lg.atlRuns};d.lastGame.away={...d.lastGame.away,abbr:lg.opp,runs:lg.oppRuns};}
    else{d.lastGame.away={...d.lastGame.away,abbr:'ATL',runs:lg.atlRuns};d.lastGame.home={...d.lastGame.home,abbr:lg.opp,runs:lg.oppRuns};}
  }
  if(upcoming.length){
    // Include isoDate so predictor can do exact date matching
    d.nextGames=upcoming.slice(0,3).map((g,i)=>({n:i+1,isoDate:g.date,date:_dayLabel(g.date),time:_gameTime(g.gameDate),opp:g.opp,loc:g.isHome?'Truist Park':`@ ${g.venue||g.opp}`}));
    d.nextOpp={...d.nextOpp,abbr:upcoming[0].opp};
  }
  // ── Live player stats ──
  // Build position map from active roster
  const posMap={};
  for(const p of live.roster?.roster||[]) posMap[p.person.id]=p.position?.abbreviation||'—';

  const fp=v=>parseFloat(String(v||'0').replace(/[^0-9.\-]/g,''))||0;

  if(live.batting){
    const splits=[...(live.batting.stats||[])].flatMap(s=>s.splits||[]);
    HEALTH.info(`MLB batting API: ${splits.length} player splits returned`);
    const batters=splits
      .filter(s=>parseInt(s.stat.plateAppearances||s.stat.atBats||0)>=10)
      .map(s=>({
        name:s.player?.fullName||s.person?.fullName||'Unknown',
        pos:posMap[s.player?.id||s.person?.id]||'—',
        avg:fp(s.stat.avg),
        obp:fp(s.stat.obp),
        slg:fp(s.stat.slg),
        ops:fp(s.stat.ops),
        hr:s.stat.homeRuns||0,
        rbi:s.stat.rbi||0,
        sb:s.stat.stolenBases||0,
      }))
      .filter(b=>b.ops>0)
      .sort((a,b)=>b.ops-a.ops)
      .slice(0,12);
    if(batters.length>0){
      d.batters=batters;
      d._liveSource='mlb';
      HEALTH.ok(`Live batting: ${batters.length} players — leader ${batters[0].name} ${batters[0].ops.toFixed(3)} OPS`);
    }else{
      HEALTH.warn(`Batting API returned ${splits.length} splits but 0 with 10+ PA/AB — keeping SEED roster`);
    }
  }else{
    HEALTH.warn('MLB batting stats API failed — showing SEED roster');
  }

  if(live.pitching){
    const splits=[...(live.pitching.stats||[])].flatMap(s=>s.splits||[]);
    HEALTH.info(`MLB pitching API: ${splits.length} pitcher splits returned`);
    const FIP_C=3.15;
    const pitchers=splits
      .filter(s=>{
        const ip=String(s.stat.inningsPitched||'0');
        return(parseInt(ip.split('.')[0]||'0')>=3);
      })
      .map(s=>{
        const st=s.stat;
        const gs=st.gamesStarted||0,g=Math.max(st.gamesPitched||1,1);
        const isSP=gs>=2&&(gs/g)>=0.35;
        const ipParts=String(st.inningsPitched||'0').split('.');
        const ipDec=(parseInt(ipParts[0]||'0'))+(parseInt(ipParts[1]||'0')/3);
        const fipRaw=ipDec>0?((13*(st.homeRuns||0)+3*((st.baseOnBalls||0)+(st.hitByPitch||0))-2*(st.strikeOuts||0))/ipDec+FIP_C):0;
        return{
          name:s.player?.fullName||s.person?.fullName||'Unknown',
          pos:isSP?'SP':'RP',
          era:fp(st.era),
          whip:fp(st.whip),
          k9:fp(st.strikeoutsPer9Inn),
          bb9:fp(st.walksPer9Inn),
          fip:Math.max(0,parseFloat(fipRaw.toFixed(2))),
          w:st.wins||0,
          sv:st.saves||0,
        };
      })
      .filter(p=>p.era>=0)
      .sort((a,b)=>{if(a.pos!==b.pos)return a.pos==='SP'?-1:1;return a.era-b.era;})
      .slice(0,12);
    if(pitchers.length>0){
      d.pitchers=pitchers;
      const ace=pitchers.find(p=>p.pos==='SP')||pitchers[0];
      HEALTH.ok(`Live pitching: ${pitchers.length} pitchers — ace ${ace.name} ${ace.era.toFixed(2)} ERA`);
    }else{
      HEALTH.warn(`Pitching API returned ${splits.length} splits but 0 with 3+ IP — keeping SEED roster`);
    }
  }else{
    HEALTH.warn('MLB pitching stats API failed — showing SEED roster');
  }

  // ── ESPN supplemental (log presence) ──
  if(live.espn&&live.espn.team){
    try{
      const stats=live.espn.team.seasonStats||live.espn.team.record?.items?.[0]?.stats||[];
      HEALTH.info(`ESPN team data available — ${stats.length} stat fields`);
    }catch(e){HEALTH.warn(`ESPN parse failed: ${e.message}`);}
  }

  // ── Live weather from Open-Meteo (Truist Park, Atlanta) ──
  if(live.weather?.current){
    try{
      const c=live.weather.current;
      const dl=live.weather.daily;
      d.weather.temp=Math.round(c.temperature_2m);
      d.weather.feelsLike=Math.round(c.apparent_temperature);
      d.weather.humidity=Math.round(c.relative_humidity_2m);
      d.weather.wind=Math.round(c.wind_speed_10m);
      d.weather.windDir=_windDir(c.wind_direction_10m);
      d.weather.rainChance=c.precipitation_probability||0;
      const wx=_wmoDesc(c.weather_code);
      d.weather.emoji=wx.emoji;d.weather.condition=wx.condition;
      if(dl){
        d.weather.hiTemp=Math.round(dl.temperature_2m_max[0]);
        d.weather.loTemp=Math.round(dl.temperature_2m_min[0]);
        d.weather.forecast=(dl.time||[]).slice(0,5).map((dt,i)=>{
          const dn=i===0?'Today':new Date(dt+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
          const w2=_wmoDesc(dl.weather_code[i]);
          return{day:dn,hi:Math.round(dl.temperature_2m_max[i]),lo:Math.round(dl.temperature_2m_min[i]),icon:w2.emoji,rain:dl.precipitation_probability_max[i]||0};
        });
      }
      HEALTH.ok(`Live weather: ${d.weather.temp}°F ${d.weather.condition} ${d.weather.rainChance}% rain`);
    }catch(e){HEALTH.warn(`Weather parse error: ${e.message}`);}
  }else{HEALTH.warn('Open-Meteo weather fetch failed — showing cached weather');}

  // ── Last game: decisions (WP/LP) + linescore from schedule hydration ──
  if(_lastSchedGame){
    if(_lastSchedGame.decisions?.winner?.fullName) d.lastGame.winner=_lastSchedGame.decisions.winner.fullName;
    if(_lastSchedGame.decisions?.loser?.fullName) d.lastGame.loser=_lastSchedGame.decisions.loser.fullName;
    if(_lastSchedGame.linescore?.innings?.length){
      const atlIsHome=d.lastGame.home.abbr==='ATL';
      const oppAbbr=(atlIsHome?d.lastGame.away.abbr:d.lastGame.home.abbr).toLowerCase();
      d.lastGame.innings=_lastSchedGame.linescore.innings.map(inn=>{
        const atlR=atlIsHome?(inn.home?.runs??0):(inn.away?.runs??0);
        const oppR=atlIsHome?(inn.away?.runs??0):(inn.home?.runs??0);
        const row={inn:String(inn.num),atl:atlR};
        row[oppAbbr]=oppR;
        return row;
      });
      // Live H/E totals
      const ls=_lastSchedGame.linescore.teams;
      if(ls){
        const atlObj=atlIsHome?d.lastGame.home:d.lastGame.away;
        const oppObj=atlIsHome?d.lastGame.away:d.lastGame.home;
        const atlT=atlIsHome?ls.home:ls.away;
        const oppT=atlIsHome?ls.away:ls.home;
        if(atlT){atlObj.hits=atlT.hits??atlObj.hits;atlObj.errors=atlT.errors??atlObj.errors;}
        if(oppT){oppObj.hits=oppT.hits??oppObj.hits;oppObj.errors=oppT.errors??oppObj.errors;}
      }
    }
    // Build a live recap from decisions + score
    const atlIsHome2=d.lastGame.home.abbr==='ATL';
    const atlR2=atlIsHome2?d.lastGame.home.runs:d.lastGame.away.runs;
    const oppR2=atlIsHome2?d.lastGame.away.runs:d.lastGame.home.runs;
    const oppAbbr2=atlIsHome2?d.lastGame.away.abbr:d.lastGame.home.abbr;
    const atlWon=atlR2>oppR2;
    if(atlWon){
      d.lastGame.recap=`${d.lastGame.winner} earned the win as Atlanta defeated ${oppAbbr2} ${atlR2}-${oppR2} on ${d.lastGame.date}. Stats updated live from MLB.com every 2 minutes.`;
    }else{
      d.lastGame.recap=`${d.lastGame.loser} took the loss as Atlanta fell to ${oppAbbr2} ${oppR2}-${atlR2} on ${d.lastGame.date}. Stats updated live from MLB.com every 2 minutes.`;
    }
  }

  // ── Live boxscore: batter & pitcher game lines ──
  if(live.boxscore?.teams){
    try{
      const atlIsHome=d.lastGame.home.abbr==='ATL';
      const atlTeam=live.boxscore.teams[atlIsHome?'home':'away'];
      if(atlTeam?.battingOrder?.length){
        const batters=atlTeam.battingOrder.map(id=>{
          const p=atlTeam.players['ID'+id];if(!p)return null;
          const b=p.stats?.batting||{};
          return{
            name:p.person.fullName,
            pos:(p.allPositions||[]).map(x=>x.abbreviation).join('/')||p.position?.abbreviation||'—',
            ab:b.atBats||0,h:b.hits||0,hr:b.homeRuns||0,rbi:b.rbi||0,r:b.runs||0,
            note:b.homeRuns>0?'HR 💥':b.rbi>=2?`${b.rbi} RBI 🔥`:b.hits>=3?`${b.hits}H 🔥`:''
          };
        }).filter(Boolean);
        if(batters.length) d.lastGame.atlBatters=batters;
      }
      if(atlTeam?.pitchers?.length){
        const saveP=_lastSchedGame?.decisions?.save?.fullName||'';
        const pitchers=atlTeam.pitchers.map(id=>{
          const p=atlTeam.players['ID'+id];if(!p)return null;
          const pit=p.stats?.pitching||{};
          const isW=p.person.fullName===d.lastGame.winner;
          const isSv=p.person.fullName===saveP;
          return{
            name:p.person.fullName,
            role:pit.gamesStarted>0?(isW?'SP (W)':'SP'):isW?'RP (W)':isSv?'RP (SV)':'RP',
            ip:pit.inningsPitched||'0.0',
            h:pit.hits||0,er:pit.earnedRuns||0,k:pit.strikeOuts||0,bb:pit.baseOnBalls||0,
            note:isW?'Win 🔥':isSv?'Save ✅':pit.earnedRuns===0&&parseInt(pit.inningsPitched)>0?'Scoreless':''
          };
        }).filter(Boolean);
        if(pitchers.length) d.lastGame.atlPitchers=pitchers;
      }
      // Build key moments from live batter lines
      const moments=[];
      for(const b of (d.lastGame.atlBatters||[])){
        if(b.hr>0) moments.push({inn:'—',icon:'💥',player:b.name,desc:`Home run — ${b.rbi} RBI`,score:''});
        else if(b.rbi>=3) moments.push({inn:'—',icon:'🔥',player:b.name,desc:`${b.rbi}-RBI performance`,score:''});
        else if(b.h>=3) moments.push({inn:'—',icon:'⚾',player:b.name,desc:`${b.h}-for-${b.ab} at the plate`,score:''});
      }
      if(moments.length) d.lastGame.keyMoments=moments.slice(0,5);
      HEALTH.ok(`Live boxscore: ${d.lastGame.atlBatters?.length||0} batters, ${d.lastGame.atlPitchers?.length||0} pitchers`);
    }catch(e){HEALTH.warn(`Boxscore parse error: ${e.message}`);}
  }else{HEALTH.warn('MLB boxscore fetch failed — showing cached last game');}

  return d;
}

async function refreshAll(){
  const pill=document.getElementById('refresh-pill');
  const lbl=document.getElementById('refresh-label');
  if(pill) pill.classList.remove('live');
  if(lbl) lbl.textContent='Updating…';
  // fetch live MLB data and AI insight in parallel
  clearTimeout(aiInsightTimer);
  const [liveResult]=await Promise.allSettled([
    fetchLiveData(),
    fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:(()=>{const d=DATA||SEED;const tb=d.batters.length?d.batters.reduce((a,b)=>b.ops>a.ops?b:a):null;const sp=d.pitchers.filter(p=>p.pos==='SP');const tp=sp.length?sp.reduce((a,b)=>b.era<a.era?b:a):null;return`Hot take: 2026 Braves are ${d.record.w}-${d.record.l}, 1st NL East. Top batter: ${tb?tb.name+' '+tb.ops.toFixed(3)+' OPS':'—'}. Ace: ${tp?tp.name+' '+tp.era.toFixed(2)+' ERA':'—'}. Last 3: ${(d.lastGame?.recentResults||[]).slice(-3).map(r=>`${r.r} vs ${r.opp} ${r.score}`).join(', ')||'recent W'}. Two punchy analyst sentences. No markdown.`})()}]})})
      .then(r=>r.json()).then(r=>{
        if(r.text){aiInsightCache=r.text;const el=document.querySelector('.ait');if(el)el.textContent=r.text;}
      })
      .catch(e=>HEALTH.warn(`AI insight fetch failed: ${e.message}`))
  ]);
  // fallback: if insight still loading after 12s, show static text
  aiInsightTimer=setTimeout(()=>{
    const el=document.querySelector('.ait');
    if(el&&el.querySelector('.spin')){
      const d=DATA||SEED;
      const fb=`Braves sit ${d.record.w}-${d.record.l} atop the NL East — elite pitching and a red-hot lineup make them the class of the division. The Chop is very much alive in 2026.`;
      el.textContent=fb; aiInsightCache=fb;
      HEALTH.fix('AI insight timed out — showing static fallback');
    }
  },12000);
  if(liveResult.status==='fulfilled'){
    DATA=mergeLiveData(SEED,liveResult.value);
    HEALTH.ok(`Live sync — ${DATA.record.w}-${DATA.record.l} · ${DATA.batters.length} batters · ${DATA.pitchers.length} pitchers`,DATA.batters.length);
  }else{
    DATA=SEED;
    HEALTH.fix(`Live fetch failed (${liveResult.reason?.message||'unknown'}) — using SEED fallback`);
  }
  // update header record live
  const rec=document.getElementById('hdr-rec');
  const sub=document.getElementById('hdr-rec-sub');
  if(rec) rec.textContent=`${DATA.record.w}-${DATA.record.l}`;
  if(sub) sub.textContent=`1ST · NL EAST · ${DATA.record.pct}`;
  const upEl=document.getElementById('last-updated');
  if(upEl) upEl.textContent=`Updated ${stamp()}`;
  if(pill) pill.classList.add('live');
  if(lbl) lbl.textContent='Refreshing every 2 min';
  renderTab(currentTab);
  clearTimeout(refreshTimer);
  refreshTimer=setTimeout(()=>refreshAll(),2*60*1000);
}

function showTab(tab,btn){
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  currentTab=tab;
  const c=document.getElementById('content');
  c.scrollTop=0;
  cbStopBlink();
  renderTab(tab);
}

function renderTab(tab){
  const d=DATA||SEED;
  const c=document.getElementById('content');
  if(c) c.dataset.tab=tab;
  const fns={
    overview:()=>renderOverview(d),
    stats:()=>renderStats(d),
    standings:()=>renderStandings(d),
    highlights:()=>renderHighlights(d),
  };
  if(fns[tab]){lastRenderTime=Date.now();HEALTH.safeRender(tab,fns[tab]);}
}

// ── OVERVIEW ──

    </div>`:''}
    ${tp?`<div class="ph pit">
      <div class="ct" style="color:var(--red)">🎯 ACE PITCHER <span style="font-size:9px;color:${d._liveSource?'var(--green)':'var(--yellow)'}">● ${d._liveSource?'LIVE':'SEED'}</span></div>
      <div class="pn">${tp.name}</div><div class="pp">${tp.pos} · ERA Leader · Updated ${stamp()}</div>
      <div class="ps">${[['ERA',tp.era.toFixed(2),MLB_PIT.era,true],['WHIP',tp.whip.toFixed(2),MLB_PIT.whip,true],['K/9',tp.k9.toFixed(1),MLB_PIT.k9,false],['BB/9',tp.bb9.toFixed(1),MLB_PIT.bb9,true],['FIP',tp.fip.toFixed(2),MLB_PIT.fip,true],['W',tp.w,6,false]].map(([l,v,a,low])=>`<div class="psi"><div class="psl">${l}</div><div class="psv" style="color:${sc(parseFloat(v),a,low)}">${v}</div></div>`).join('')}</div>
    </div>`:''}

    <div class="card" style="background:linear-gradient(135deg,#0a1628,#0d1f2a);border-color:#38bdf844;position:relative;overflow:hidden">
      <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#38bdf8,#0ea5e9)"></div>

let cbMsgs=[], cbApiHist=[], cbBusy=false, cbBlinkT=null;

function cbStopBlink(){if(cbBlinkT){clearTimeout(cbBlinkT);cbBlinkT=null}}

function cbBlink(){
  const b=document.getElementById('cb-bot');
  if(!b){cbBlinkT=null;return}
  b.classList.add('blink');
  setTimeout(()=>b.classList.remove('blink'),140);
  cbBlinkT=setTimeout(cbBlink,2200+Math.random()*2600);
}

function cbState(s){
  const b=document.getElementById('cb-bot'),st=document.getElementById('cb-stxt');
  if(!b)return;
  b.classList.remove('thinking','talking','happy');
  if(s==='thinking'){b.classList.add('thinking');if(st)st.textContent='Thinking…'}
  else if(s==='talking'){b.classList.add('talking');if(st)st.textContent='Responding…'}
  else if(s==='happy'){
    b.classList.add('happy');
    if(st)st.textContent='Let\'s go Braves! 🪓';
    setTimeout(()=>{b.classList.remove('happy');if(st)st.textContent='Ready to Chop'},1200);
  }else{if(st)st.textContent='Ready to Chop'}
}

function cbEsc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function cbScrollEnd(){const el=document.getElementById('cb-msgs');if(el)el.scrollTop=el.scrollHeight}

function cbAddBubble(from,text,isTyping=false){
  const el=document.getElementById('cb-msgs');if(!el)return;
  document.querySelectorAll('.cb-typing').forEach(n=>n.remove());
  const d=document.createElement('div');
  d.className='cmsg '+(from==='user'?'user':'bot')+(isTyping?' cb-typing':'');
  if(from==='user'){
    d.innerHTML=`<div class="cbubble">${cbEsc(text)}</div>`;
  }else if(isTyping){
    d.innerHTML=`<div class="cavy">🪓</div><div class="cbubble"><div class="ctyping"><span></span><span></span><span></span></div></div>`;
  }else{
    d.innerHTML=`<div class="cavy">🪓</div><div class="cbubble">${text}</div>`;
  }
  el.appendChild(d);cbScrollEnd();
}

async function cbSend(override){
  if(cbBusy)return;
  const inp=document.getElementById('cb-inp');
  const txt=(override||inp?.value||'').trim();
  if(!txt)return;
  if(inp)inp.value='';
  const btn=document.getElementById('cb-send');

  cbAddBubble('user',txt);
  cbMsgs.push({from:'user',text:txt});
  cbApiHist.push({role:'user',content:txt});
  cbBusy=true;
  if(btn)btn.disabled=true;
  cbState('thinking');
  cbAddBubble('bot','',true);

  try{
    const res=await fetch('/api/chat',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:cbApiHist})});
    const data=await res.json();
    const reply=data.text||'Sorry, had trouble with that one — try again! 🪓';
    cbApiHist.push({role:'assistant',content:reply});
    cbMsgs.push({from:'bot',text:reply});
    cbState('talking');
    cbAddBubble('bot',reply);
    setTimeout(()=>cbState('happy'),400);
  }catch(e){
    cbMsgs.push({from:'bot',text:'Couldn\'t connect right now. Check your signal and try again! ⚾'});
    cbState('idle');
    cbAddBubble('bot','Couldn\'t connect right now. Check your signal and try again! ⚾');
  }

  cbBusy=false;
  if(btn)btn.disabled=false;
  if(inp&&!override)inp.focus();
}

// SCORE PREDICTOR
// ════════════════════════════════════════
let predAtl=3,predOpp=2;

function predGet(){try{return JSON.parse(localStorage.getItem('braves_preds')||'[]')}catch(e){return[]}}
function predSave(p){localStorage.setItem('braves_preds',JSON.stringify(p))}

function predSettle(){
  const preds=predGet();
  const d=DATA||SEED;
  // Primary: use completedGames (10 games, has ISO date for exact matching)
  // Fallback: use lastGame.recentResults
  const completed=d.completedGames||[];
  const recent=d.lastGame.recentResults||[];
  let changed=false;
  for(const p of preds){
    if(p.settled)continue;
    let match=null;
    // Try ISO date match first (most reliable)
    if(p.isoDate&&completed.length){
      match=completed.find(g=>g.isoDate===p.isoDate&&g.opp===p.opp);
    }
    // Fall back to day-number + opponent match
    if(!match){
      const predDay=String(p.date.match(/\d+$/)?.[0]||'');
      // Check completedGames (has ISO date: extract day from "2026-05-31")
      match=completed.find(g=>{
        const day=String(parseInt(g.isoDate?.split('-')[2]||'0'));
        return g.opp===p.opp&&day===predDay;
      });
      // Last resort: check recentResults display dates
      if(!match) match=recent.find(r=>r.opp===p.opp&&String(r.date.split(' ')[1])===predDay);
    }
    if(match){
      const[atlA,oppA]=match.score.split('-').map(Number);
      p.atlActual=atlA;p.oppActual=oppA;p.settled=true;
      const ad=Math.abs(p.atlPick-atlA),od=Math.abs(p.oppPick-oppA);
      const atlWon=atlA>oppA,pickWon=p.atlPick>p.oppPick;
      if(ad===0&&od===0)p.result='exact';
      else if(ad<=1&&od<=1)p.result='close';
      else if(atlWon===pickWon)p.result='winner';
      else p.result='miss';
      changed=true;
      HEALTH.fix(`Score predictor: settled ATL vs ${p.opp} on ${p.isoDate||p.date} — result: ${p.result}`);
    }
  }
  if(changed)predSave(preds);
  return preds;
}

function predAdjust(team,delta){
  if(team==='atl')predAtl=Math.max(0,Math.min(20,predAtl+delta));
  else predOpp=Math.max(0,Math.min(20,predOpp+delta));
  const as=document.getElementById('pred-atl-s');
  const os=document.getElementById('pred-opp-s');
  if(as)as.textContent=predAtl;
  if(os)os.textContent=predOpp;
}

function predLock(){
  const d=DATA||SEED;
  if(!d.nextGames[0])return;
  const ng=d.nextGames[0];
  const key=ng.opp+'-'+ng.date;
  const preds=predGet();
  if(preds.find(p=>p.key===key))return;
  preds.unshift({key,opp:ng.opp,date:ng.date,isoDate:ng.isoDate||null,time:ng.time,
    atlPick:predAtl,oppPick:predOpp,settled:false,result:null,atlActual:null,oppActual:null});
  predSave(preds);
  renderPredictor();
}

function predBadge(result){
  const m={exact:['exact','🎯 Exact'],close:['close','🔥 Close'],winner:['winner','✅ Winner'],miss:['miss','❌ Miss'],pending:['pending','⏳ Pending']};
  const[cls,label]=m[result]||m.pending;
  return`<span class="pred-badge ${cls}">${label}</span>`;
}

function renderPredictor(){
  const d=DATA||SEED;
  const ng=d.nextGames[0];
  const preds=predSettle();
  const key=ng?ng.opp+'-'+ng.date:null;
  const locked=key?preds.find(p=>p.key===key):null;
  const settled=preds.filter(p=>p.settled);
  const exact=settled.filter(p=>p.result==='exact').length;
  const close=settled.filter(p=>p.result==='close').length;
  const win=settled.filter(p=>p.result==='winner').length;

  document.getElementById('content').innerHTML=`
    <div class="pred-card">
      <div class="ct" style="color:var(--green)">🎯 SCORE PREDICTOR</div>
      ${ng?`
        <div style="text-align:center;margin-bottom:16px">
          <div style="font-family:'Anton',sans-serif;font-size:26px">ATL <span style="color:var(--dim);font-size:18px">vs</span> ${ng.opp}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">${ng.date} · ${ng.time}</div>
          <div style="font-size:11px;color:var(--dim)">${ng.loc}</div>
        </div>
        ${locked?`
          <div class="pred-locked">🔒 Locked in: <strong>ATL ${locked.atlPick} – ${ng.opp} ${locked.oppPick}</strong></div>
          ${locked.settled
            ?`<div style="text-align:center;margin-top:10px;font-size:14px">Final: ATL ${locked.atlActual} – ${ng.opp} ${locked.oppActual} &nbsp; ${predBadge(locked.result)}</div>`
            :`<div style="text-align:center;margin-top:8px;font-size:12px;color:var(--dim)">Check back after the game ⚾</div>`}
        `:`
          <div class="pred-pickers">
            <div class="pred-team">
              <div class="pred-team-lbl">ATL</div>
              <button class="pred-adj" onclick="predAdjust('atl',1)">▲</button>
              <div class="pred-num" id="pred-atl-s">${predAtl}</div>
              <button class="pred-adj" onclick="predAdjust('atl',-1)">▼</button>
            </div>
            <div style="font-family:'Anton',sans-serif;font-size:22px;color:var(--dim);padding-top:34px">VS</div>
            <div class="pred-team">
              <div class="pred-team-lbl">${ng.opp}</div>
              <button class="pred-adj" onclick="predAdjust('opp',1)">▲</button>
              <div class="pred-num" id="pred-opp-s">${predOpp}</div>
              <button class="pred-adj" onclick="predAdjust('opp',-1)">▼</button>
            </div>
          </div>
          <button class="pred-lock-btn" onclick="predLock()">🔒 LOCK IT IN</button>
        `}
      `:`<div style="text-align:center;color:var(--dim);padding:20px">No upcoming game scheduled</div>`}
    </div>
    ${settled.length>0?`
    <div class="card">
      <div class="ct" style="color:var(--muted)">📊 YOUR ACCURACY</div>
      <div class="sg">
        <div class="sb"><div class="sl">PICKS</div><div class="sv">${settled.length}</div></div>
        <div class="sb"><div class="sl">GOT WINNER</div><div class="sv" style="color:var(--green)">${exact+close+win}</div></div>
        <div class="sb"><div class="sl">EXACT 🎯</div><div class="sv" style="color:var(--yellow)">${exact}</div></div>
      </div>
    </div>`:''}
    <div class="card">
      <div class="ct" style="color:var(--muted)">🗒️ PAST PICKS</div>
      ${preds.length===0
        ?`<div style="text-align:center;color:var(--dim);padding:16px;font-size:13px">No picks yet — lock in your first prediction above!</div>`
        :preds.map(p=>`
          <div class="pred-row">
            <div>
              <div style="font-weight:700;font-size:14px">${p.date} · vs ${p.opp}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:2px">My pick: ATL ${p.atlPick}–${p.opp} ${p.oppPick}</div>
              ${p.settled?`<div style="font-size:12px;color:var(--dim)">Final: ATL ${p.atlActual}–${p.opp} ${p.oppActual}</div>`:''}
            </div>
            ${predBadge(p.settled?p.result:'pending')}
          </div>`).join('')}
    </div>`;
}

// ── HEALTH DASHBOARD UI ──
function showHealth(){
  if(document.getElementById('h-ov'))return;
  const s=HEALTH.getSt();
  const log=HEALTH.getLog();
  const statusColor={green:'var(--green)',yellow:'var(--yellow)',red:'var(--crimson)'}[s.status]||'var(--green)';
  const statusLabel={green:'All Systems Operational',yellow:'Some Issues Detected',red:'Errors Detected'}[s.status]||'OK';
  const lastSyncAgo=s.lastSync?Math.round((Date.now()-s.lastSync)/1000)+'s ago':'Never';

  const systems=[
    {name:'Live Scores & Standings',dot:s.errs===0?'var(--green)':'var(--crimson)',status:s.errs===0?'Syncing normally':'Errors detected'},
    {name:'Player Stats (Batting)',dot:s.lastSyncPlayers>0?'var(--green)':'var(--yellow)',status:s.lastSyncPlayers>0?`${s.lastSyncPlayers} players loaded`:'Using seed data'},
    {name:'Score Predictor',dot:'var(--green)',status:'Storing picks locally'},
    {name:'Auto-refresh Timer',dot:refreshTimer?'var(--green)':'var(--crimson)',status:refreshTimer?'Running every 2 min':'Stopped'},
    {name:'Network',dot:'var(--green)',status:navigator.onLine?'Online':'Offline'},
    {name:'Last Sync',dot:'var(--green)',status:lastSyncAgo},
  ];

  const logHtml=log.length===0
    ?`<div class="h-empty">No events yet — all clear 🪓</div>`
    :log.map(e=>`
      <div class="h-ev">
        <div class="h-ei">${e.icon}</div>
        <div>
          <div class="h-em" style="color:${e.type==='fix'?'var(--green)':e.type==='err'?'var(--crimson)':e.type==='warn'?'var(--yellow)':e.type==='ok'?'var(--green)':'var(--text)'}">${e.msg}</div>
          <div class="h-et">${e.t}</div>
        </div>
      </div>`).join('');

  const ov=document.createElement('div');
  ov.id='h-ov';ov.className='h-ov';
  ov.innerHTML=`
    <div class="h-hdr">
      <div>
        <div class="h-ttl">SYSTEM HEALTH</div>
        <div style="font-size:10px;color:${statusColor};margin-top:2px;letter-spacing:1px">${statusLabel}</div>
      </div>
      <button class="h-cls" onclick="closeHealth()">×</button>
    </div>
    <div class="h-body">
      <div class="h-sg">
        <div class="h-s"><div class="h-sv">${HEALTH.uptime()}</div><div class="h-sl">Uptime</div></div>
        <div class="h-s"><div class="h-sv" style="color:var(--green)">${s.fixes}</div><div class="h-sl">Auto-Fixes</div></div>
        <div class="h-s"><div class="h-sv" style="color:${s.errs>0?'var(--crimson)':'var(--green)'}">${s.errs}</div><div class="h-sl">Errors</div></div>
        <div class="h-s"><div class="h-sv">${s.calls}</div><div class="h-sl">API Calls</div></div>
        <div class="h-s"><div class="h-sv" style="color:var(--yellow)">${s.warns}</div><div class="h-sl">Warnings</div></div>
        <div class="h-s"><div class="h-sv">${log.filter(e=>e.type==='ok').length}</div><div class="h-sl">Good Syncs</div></div>
      </div>
      <div class="card" style="margin-bottom:12px">
        <div class="ct" style="color:var(--muted)">SYSTEMS</div>
        ${systems.map(s=>`<div class="h-sys"><div class="h-sdot" style="background:${s.dot}"></div><div class="h-sn">${s.name}</div><div class="h-ss">${s.status}</div></div>`).join('')}
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div class="ct" style="color:var(--muted);margin-bottom:0">FIX LOG (${log.length})</div>
          <button onclick="HEALTH.clearLog();closeHealth();showHealth()" style="font-size:11px;color:var(--dim);background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;cursor:pointer;font-family:'DM Sans',sans-serif">Clear</button>
        </div>
        ${logHtml}
      </div>
    </div>`;
  document.getElementById('app').appendChild(ov);
}

function closeHealth(){const o=document.getElementById('h-ov');if(o)o.remove();}

window.addEventListener('offline',()=>{
  HEALTH.warn('Network went offline — pausing auto-refresh');
  clearTimeout(refreshTimer);refreshTimer=null;
  const lbl=document.getElementById('refresh-label');
  if(lbl)lbl.textContent='Offline — waiting for connection';
});
window.addEventListener('online',()=>{
  HEALTH.fix('Network restored — resuming live updates');
  refreshAll();
});

// ── VISIBILITY WATCHDOG ── (recover when user returns to tab)
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  const s=HEALTH.getSt();
  const stale=!s.lastSync||(Date.now()-s.lastSync)>5*60*1000;
  if(stale){
    HEALTH.fix('App resumed from background with stale data — refreshing');
    refreshAll();
  }
});

// ── STALENESS & DOM WATCHDOG ── (runs every 60s)
setInterval(()=>{
  if(!navigator.onLine)return;
  const s=HEALTH.getSt();
  // restart dead timer
  if(!refreshTimer){
    HEALTH.fix('Refresh timer was stopped — restarting auto-refresh');
    refreshAll();return;
  }
  // force refresh if data is stale
  if(s.lastSync&&(Date.now()-s.lastSync)>5*60*1000){
    HEALTH.fix('Data stale >5 min — forcing emergency refresh');
    refreshAll();return;
  }
  // DOM integrity: re-render if content area went blank after a successful render
  const c=document.getElementById('content');
  if(c&&lastRenderTime>0&&!c.innerHTML.trim()){
    HEALTH.fix('Content area found empty — re-rendering current tab');
    renderTab(currentTab);
  }
  // AI insight stuck on spinner >15s after render
  const ait=document.querySelector('.ait');
  if(ait&&ait.querySelector('.spin')&&(Date.now()-lastRenderTime)>15000){
    const d=DATA||SEED;
    const fb=`Braves sit ${d.record.w}-${d.record.l} atop the NL East — elite pitching and a loaded lineup make them the class of the division. The Chop is very much alive in 2026.`;
    ait.textContent=fb; aiInsightCache=fb;
    HEALTH.fix('AI insight stuck on spinner — replaced with static fallback');
  }
},60*1000);

// ── LOCALSTORAGE INTEGRITY CHECK ──
(()=>{
  try{
    const preds=localStorage.getItem('braves_preds');
    if(preds){
      const p=JSON.parse(preds);
      if(!Array.isArray(p))throw new Error('not an array');
    }
  }catch(e){
    localStorage.removeItem('braves_preds');
    HEALTH.fix(`Score predictor data was corrupted — reset to clean state (${e.message})`);
  }
})();

HEALTH.info('Dashboard initialised — beginning first sync');
DATA=SEED;
refreshAll();
