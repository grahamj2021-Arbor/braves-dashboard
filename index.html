<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Braves" />
  <meta name="theme-color" content="#0a0f0d" />
  <title>Braves Dashboard</title>
  <link rel="manifest" href="manifest.json" />
  <!-- Apple touch icon fallback (inline SVG as data URI) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23002B5C'/%3E%3Ctext x='90' y='115' font-size='80' text-anchor='middle' fill='%23CE1141' font-family='Arial Black'%3EA%3C/text%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Anton&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #002B5C;
      --red: #CE1141;
      --bg: #0a0f0d;
      --card: #0d1a0f;
      --card2: #0a1628;
      --green: #22c55e;
      --yellow: #facc15;
      --crimson: #ef4444;
      --blue: #38bdf8;
      --text: #e8ede9;
      --muted: #8ab4a0;
      --dim: #5a7a62;
      --border: #1e3a26;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, var(--navy) 0%, #0a1628 100%);
      border-bottom: 2px solid var(--red);
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(206,17,65,0.25);
    }
    .header-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--red), var(--navy));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Anton', sans-serif; font-size: 15px; color: #fff;
      box-shadow: 0 0 16px rgba(206,17,65,0.5);
      flex-shrink: 0;
    }
    .header-title { font-family: 'Anton', sans-serif; font-size: 20px; letter-spacing: 1.5px; }
    .header-sub { font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-top: 1px; }
    .header-record {
      margin-left: auto; text-align: right;
      font-family: 'Anton', sans-serif; font-size: 24px;
      color: var(--green); text-shadow: 0 0 10px rgba(34,197,94,0.4);
      line-height: 1;
    }
    .header-record-sub { font-size: 9px; color: var(--muted); margin-top: 2px; }

    /* ── SCROLL CONTENT ── */
    .content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 12px calc(80px + var(--safe-bottom));
    }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: rgba(10,15,13,0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid #1e3a26;
      display: flex;
      padding-bottom: var(--safe-bottom);
      z-index: 100;
    }
    .nav-btn {
      flex: 1; border: none; background: none; color: var(--dim);
      padding: 10px 4px 8px;
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; gap: 3px; transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
      font-family: 'DM Sans', sans-serif;
    }
    .nav-btn.active { color: var(--green); }
    .nav-btn .nav-icon { font-size: 20px; line-height: 1; }
    .nav-btn .nav-label { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .nav-btn.active .nav-label { color: var(--green); }

    /* ── CARDS ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      margin-bottom: 12px; text-transform: uppercase;
    }

    /* ── STAT GRID ── */
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-box {
      background: #0a1410; border: 1px solid #1e3a26;
      border-radius: 10px; padding: 12px 8px; text-align: center;
    }
    .stat-label { font-size: 9px; color: var(--dim); letter-spacing: 1.5px; margin-bottom: 4px; text-transform: uppercase; }
    .stat-val { font-family: 'Anton', sans-serif; font-size: 26px; line-height: 1; }
    .stat-sub { font-size: 9px; color: var(--dim); margin-top: 3px; }

    /* ── AI INSIGHT ── */
    .ai-card {
      background: linear-gradient(135deg, #0d1f0f, #0a1628);
      border: 1px solid #22c55e44;
      border-radius: 14px; padding: 14px;
      margin-bottom: 12px; position: relative; overflow: hidden;
    }
    .ai-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--green), var(--red));
    }
    .ai-label { font-size: 10px; color: var(--green); letter-spacing: 2px; font-weight: 700; margin-bottom: 8px; }
    .ai-text { font-size: 14px; line-height: 1.6; color: #d4edda; }

    /* ── BADGE ── */
    .badge {
      display: inline-block; padding: 3px 9px; border-radius: 6px;
      font-weight: 700; font-size: 13px; font-family: 'JetBrains Mono', monospace;
    }
    .badge-green { background: #22c55e22; color: var(--green); border: 1px solid #22c55e55; }
    .badge-yellow { background: #facc1522; color: var(--yellow); border: 1px solid #facc1555; }
    .badge-red { background: #ef444422; color: var(--crimson); border: 1px solid #ef444455; }

    /* ── HERO PLAYER CARD ── */
    .player-hero {
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
      position: relative; overflow: hidden;
    }
    .player-hero.batter {
      background: linear-gradient(135deg, #0d1f0f, #091209);
      border: 1px solid #22c55e55;
    }
    .player-hero.pitcher {
      background: linear-gradient(135deg, #1a0d14, #0d0912);
      border: 1px solid #CE114155;
    }
    .player-name { font-family: 'Anton', sans-serif; font-size: 20px; margin-bottom: 2px; }
    .player-pos { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
    .player-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .ps-item { text-align: center; }
    .ps-label { font-size: 9px; color: var(--dim); margin-bottom: 3px; letter-spacing: 1px; }
    .ps-val { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; }

    /* ── RESULT PILLS ── */
    .results-row { display: flex; gap: 8px; }
    .result-pill {
      flex: 1; border-radius: 10px; padding: 12px 8px; text-align: center;
    }
    .result-pill.win { background: #22c55e15; border: 1px solid #22c55e44; }
    .result-pill.loss { background: #ef444415; border: 1px solid #ef444444; }
    .result-date { font-size: 10px; color: var(--dim); margin-bottom: 3px; }
    .result-letter { font-family: 'Anton', sans-serif; font-size: 22px; }
    .result-score { font-family: 'JetBrains Mono', monospace; font-size: 14px; }

    /* ── WEATHER ── */
    .weather-main { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
    .weather-temp { font-family: 'Anton', sans-serif; font-size: 52px; line-height: 1; color: #fff; }
    .weather-cond { font-weight: 700; font-size: 16px; }
    .weather-feels { font-size: 12px; color: var(--muted); }
    .weather-details { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .wd-item { font-size: 12px; }
    .wd-label { color: var(--dim); }
    .wd-val { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
    .forecast-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .forecast-row::-webkit-scrollbar { display: none; }
    .fc-day {
      flex-shrink: 0; text-align: center; padding: 10px 10px;
      border-radius: 10px; border: 1px solid #1e3a46; min-width: 58px;
    }
    .fc-day.today { background: #38bdf822; border-color: #38bdf844; }
    .fc-label { font-size: 9px; color: var(--blue); font-weight: 700; margin-bottom: 3px; letter-spacing: 1px; }
    .fc-icon { font-size: 20px; margin-bottom: 3px; }
    .fc-hi { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #fff; }
    .fc-lo { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5a7a82; }
    .fc-rain { font-size: 10px; font-weight: 700; margin-top: 3px; }
    .alert-bar {
      margin-top: 10px; padding: 10px 12px; border-radius: 8px;
      background: #ef444415; border: 1px solid #ef444433;
      font-size: 12px; color: #fca5a5; line-height: 1.5;
    }

    /* ── TABLE (batting/pitching) ── */
    .player-list { display: flex; flex-direction: column; gap: 10px; }
    .player-row {
      background: #0d1a0f; border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
    }
    .pr-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .pr-name { font-weight: 700; font-size: 15px; flex: 1; }
    .pr-pos {
      font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 700;
    }
    .pr-pos.sp { background: #002B5C44; color: #60a5fa; }
    .pr-pos.rp { background: #CE114122; color: #f87171; }
    .pr-pos.bat { background: #22c55e11; color: var(--green); }
    .pr-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .prs-item { text-align: center; }
    .prs-label { font-size: 9px; color: var(--dim); letter-spacing: 1px; margin-bottom: 2px; }

    /* ── STANDINGS ── */
    .standings-table { width: 100%; border-collapse: collapse; }
    .standings-table th {
      font-size: 10px; color: var(--dim); letter-spacing: 1.5px;
      padding: 6px 8px; text-align: center; font-weight: 700;
    }
    .standings-table th:first-child { text-align: left; }
    .standings-table td { padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .standings-table td:not(:first-child) { text-align: center; font-family: 'JetBrains Mono', monospace; }
    .standings-table tr.me td { background: #22c55e08; }
    .standings-table tr.me td:first-child { color: var(--green); font-weight: 700; }

    .rank-bar-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .rank-num { font-size: 10px; color: var(--dim); width: 18px; flex-shrink: 0; }
    .rank-name { flex: 1; font-size: 13px; }
    .rank-bar-wrap { width: 70px; height: 5px; background: #1e3a26; border-radius: 3px; overflow: hidden; flex-shrink: 0; }
    .rank-bar { height: 100%; border-radius: 3px; }
    .rank-pct { font-family: 'JetBrains Mono', monospace; font-size: 12px; width: 36px; text-align: right; flex-shrink: 0; }

    /* ── NEXT SERIES ── */
    .matchup-header {
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(135deg, #0d1a0f, var(--card2));
      border: 1px solid #CE114155; border-radius: 14px; padding: 16px;
      margin-bottom: 12px;
    }
    .mh-vs { font-family: 'Anton', sans-serif; font-size: 26px; }
    .mh-rec { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .game-cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .game-card {
      background: #0a1a0c; border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .gc-num {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--red); color: #fff;
      font-family: 'Anton', sans-serif; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .gc-info { flex: 1; }
    .gc-date { font-weight: 700; font-size: 14px; }
    .gc-loc { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .gc-time { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--yellow); }

    .matchup-row {
      display: grid; grid-template-columns: 1fr auto 1fr;
      gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .matchup-row .atl-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; text-align: left; }
    .matchup-row .row-label { font-size: 10px; color: var(--dim); letter-spacing: 1px; text-align: center; text-transform: uppercase; }
    .matchup-row .bos-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; text-align: right; }
    .edge-box {
      margin-top: 12px; padding: 12px; border-radius: 10px;
      background: #22c55e11; border: 1px solid #22c55e33; text-align: center;
      font-size: 13px; line-height: 1.6;
    }

    /* ── MLB LEGEND ── */
    .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; margin-bottom: 12px; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── SPINNER ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px; height: 16px; border: 2px solid #22c55e44;
      border-top-color: var(--green); border-radius: 50%;
      animation: spin 0.8s linear infinite; display: inline-block;
    }
  </style>
</head>

// ── helpers ──
function pct(w,l){ return (w/(w+l)).toFixed(3).replace("0.","."); }
function gb(tw,tl,w,l){ const g=((tw-w)+(l-tl))/2; return g===0?"—":g.toFixed(1); }
function statColor(val,avg,low=false){
  const diff = low ? avg-val : val-avg;
  if(diff > 0.05*avg) return "green";
  if(diff < -0.05*avg) return "red";
  return "yellow";
}
function badge(val,avg,low,fmt){
  const c = statColor(val,avg,low);
  const cls = c==="green"?"badge badge-green":c==="red"?"badge badge-red":"badge badge-yellow";
  const d = fmt ? fmt(val) : val;
  return `<span class="${cls}">${d}</span>`;
}
function rainColor(r){ return r>=60?"var(--crimson)":r>=30?"var(--yellow)":"var(--green)"; }

// ── AI Insight ──
let aiLoaded = false, aiText = "";
async function loadAI(){
  if(aiLoaded) return;
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:1000,
        system:"You are a sharp MLB analyst. Be concise and use baseball lingo. No markdown. 3 sentences max.",
        messages:[{role:"user",content:"Hot take on the 2026 Atlanta Braves: 36-18, 1st NL East. Strider ERA 2.91, Acuña .282/14SB. Next: vs Boston (22-30) at Fenway. Keep it punchy."}]
      })
    });
    const d = await r.json();
    aiText = d.content?.map(c=>c.text||"").join("") || "The Chop Shop is humming — 36-18 and rolling.";
  } catch(e){ aiText = "The Chop Shop is humming — 36-18 and rolling."; }
  aiLoaded = true;
  const el = document.getElementById("ai-text");
  if(el){ el.innerHTML = aiText; document.getElementById("ai-spinner")?.remove(); }
}

// ── TABS ──
function showTab(tab, btn){
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  const c = document.getElementById("content");
  c.scrollTop = 0;
  if(tab==="overview") renderOverview(c);
  else if(tab==="batting") renderBatting(c);
  else if(tab==="pitching") renderPitching(c);
  else if(tab==="standings") renderStandings(c);
  else if(tab==="series") renderSeries(c);
  else if(tab==="highlights") renderHighlights(c);
}

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div style="text-align:center;flex:1;">
          <div style="font-family:'Anton',sans-serif;font-size:14px;color:var(--muted);">ATL</div>
          <div style="font-family:'Anton',sans-serif;font-size:52px;color:var(--green);line-height:1;text-shadow:0 0 20px rgba(34,197,94,0.4);">10</div>
          <div style="font-size:10px;color:var(--dim);">11 H · 0 E</div>
        </div>
        <div style="text-align:center;padding:0 8px;">
          <div style="font-family:'Anton',sans-serif;font-size:20px;color:var(--dim);">FINAL</div>
          <div style="font-size:10px;color:var(--dim);margin-top:2px;">@ Fenway Park</div>
        </div>
        <div style="text-align:center;flex:1;">
          <div style="font-family:'Anton',sans-serif;font-size:14px;color:var(--muted);">BOS</div>
          <div style="font-family:'Anton',sans-serif;font-size:52px;color:var(--crimson);line-height:1;text-shadow:0 0 20px rgba(239,68,68,0.3);">2</div>
          <div style="font-size:10px;color:var(--dim);">8 H · 0 E</div>
        </div>
      </div>
      <div style="font-size:13px;color:#d4edda;line-height:1.6;border-top:1px solid var(--border);padding-top:10px;">${g.recap}</div>
      <div style="display:flex;gap:12px;margin-top:10px;font-size:12px;">
        <span>✅ <strong style="color:var(--green)">${g.winner}</strong></span>
        <span>❌ <strong style="color:var(--crimson)">${g.loser}</strong></span>
      </div>
    </div>

    <!-- Linescore -->
    <div class="card" style="padding:14px 10px;overflow-x:auto;">
      <div class="card-title" style="color:var(--muted);padding-left:4px;">LINESCORE</div>
      <table style="width:100%;border-collapse:collapse;min-width:340px;">
        <thead><tr>
          <td style="padding:4px 6px;font-size:10px;color:var(--dim);font-weight:700;width:40px;"></td>
          ${lsInnings}
          <td style="text-align:center;padding:6px 6px;font-size:11px;color:var(--dim);font-weight:700;border-left:1px solid var(--border);">R</td>
          <td style="text-align:center;padding:6px 4px;font-size:11px;color:var(--dim);font-weight:700;">H</td>
          <td style="text-align:center;padding:6px 4px;font-size:11px;color:var(--dim);font-weight:700;">E</td>
        </tr></thead>
        <tbody>
          <tr style="background:#22c55e08;">
            <td style="padding:6px;font-family:'Anton',sans-serif;font-size:13px;color:var(--green);">ATL</td>
            ${lsATL}
            <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--green);border-left:1px solid var(--border);">10</td>
            <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);">11</td>
            <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);">0</td>
          </tr>
          <tr>
            <td style="padding:6px;font-family:'Anton',sans-serif;font-size:13px;color:var(--crimson);">BOS</td>
            ${lsBOS}
            <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--crimson);border-left:1px solid var(--border);">2</td>
            <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);">8</td>
            <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);">0</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Key Moments -->
    <div class="card">
      <div class="card-title" style="color:var(--yellow);">⚡ KEY MOMENTS</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${g.keyMoments.map(m=>`
          <div style="display:flex;gap:12px;align-items:flex-start;padding:10px 12px;background:#0a1410;border-radius:10px;border:1px solid var(--border);">
            <div style="font-size:24px;flex-shrink:0;line-height:1.2;">${m.icon}</div>
            <div style="flex:1;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
                <span style="font-weight:700;font-size:14px;color:var(--text);">${m.player}</span>
                <span style="font-size:10px;color:var(--dim);letter-spacing:1px;">${m.inning}</span>
              </div>
              <div style="font-size:12px;color:var(--muted);margin-bottom:3px;">${m.desc}</div>
              <div style="font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--green);font-weight:700;">${m.score}</div>
            </div>
          </div>`).join("")}
      </div>
    </div>

    <!-- ATL Batting -->
    <div class="card">
      <div class="card-title" style="color:var(--green);">🏏 ATL BATTING</div>
      <table style="width:100%;border-collapse:collapse;">
        <thead><tr style="font-size:9px;color:var(--dim);letter-spacing:1.5px;">
          <th style="text-align:left;padding:4px 8px;">PLAYER</th>
          <th style="text-align:center;padding:4px 4px;">AB</th>
          <th style="text-align:center;padding:4px 4px;">H</th>
          <th style="text-align:center;padding:4px 4px;">HR</th>
          <th style="text-align:center;padding:4px 4px;">RBI</th>
          <th style="text-align:center;padding:4px 4px;">R</th>
        </tr></thead>
        <tbody>
          ${g.atlBatters.map((b,i)=>`
            <tr style="background:${i%2===0?'#0d1a0f':'#0a140c'};border-bottom:1px solid var(--border);">
              <td style="padding:9px 8px;">
                <div style="font-weight:700;font-size:13px;">${b.name}</div>
                ${b.note?`<div style="font-size:10px;color:var(--yellow);">${b.note}</div>`:''}
              </td>
              <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 4px;color:var(--muted);">${b.ab}</td>
              <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 4px;color:${b.h>0?'var(--green)':'var(--dim)'};">${b.h}</td>
              <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 4px;color:${b.hr>0?'var(--yellow)':'var(--dim)'};">${b.hr||'—'}</td>
              <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 4px;color:${b.rbi>0?'var(--green)':'var(--dim)'};">${b.rbi}</td>
              <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 4px;color:${b.r>0?'var(--blue)':'var(--dim)'};">${b.r}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>

    <!-- ATL Pitching -->
    <div class="card">
      <div class="card-title" style="color:var(--red);">⚾ ATL PITCHING</div>
      <table style="width:100%;border-collapse:collapse;">
        <thead><tr style="font-size:9px;color:var(--dim);letter-spacing:1.5px;">
          <th style="text-align:left;padding:4px 8px;">PITCHER</th>
          <th style="text-align:center;padding:4px 4px;">IP</th>
          <th style="text-align:center;padding:4px 4px;">H</th>
          <th style="text-align:center;padding:4px 4px;">ER</th>
          <th style="text-align:center;padding:4px 4px;">K</th>
          <th style="text-align:center;padding:4px 4px;">BB</th>
        </tr></thead>
        <tbody>
          ${g.atlPitchers.map((p,i)=>`
            <tr style="background:${i%2===0?'#0d1a0f':'#0a140c'};border-bottom:1px solid var(--border);">
              <td style="padding:9px 8px;">
                <div style="font-weight:700;font-size:13px;">${p.name}</div>
                <div style="font-size:10px;color:${p.role.includes('W')?'var(--green)':'var(--dim)'};">${p.role}${p.note?' · '+p.note:''}</div>
              </td>
              <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 4px;color:var(--muted);">${p.ip}</td>
              <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 4px;color:${p.h>0?'var(--yellow)':'var(--dim)'};">${p.h}</td>
              <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 4px;color:${p.er>0?'var(--crimson)':'var(--green)'};">${p.er}</td>
              <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 4px;color:${p.k>4?'var(--green)':p.k>0?'var(--muted)':'var(--dim)'};">${p.k}</td>
              <td style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 4px;color:${p.bb>2?'var(--crimson)':'var(--muted)'};">${p.bb}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>

    <!-- Series Summary -->
    <div class="card" style="margin-bottom:24px;">
      <div class="card-title" style="color:var(--blue);">📋 SERIES vs BOSTON</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${g.series.map(s=>`
          <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
            background:${s.result==='W'?'#22c55e11':'#ef444411'};
            border:1px solid ${s.result==='W'?'#22c55e44':'#ef444444'};">
            <div style="font-family:'Anton',sans-serif;font-size:22px;color:${s.result==='W'?'var(--green)':'var(--crimson)'};">${s.result}</div>
            <div>
              <div style="font-weight:700;font-size:13px;">${s.score}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:1px;">${s.game} · ${s.note}</div>
            </div>
          </div>`).join("")}
        <div style="text-align:center;margin-top:4px;padding:10px;border-radius:10px;background:#22c55e11;border:1px solid #22c55e33;">
          <span style="font-family:'Anton',sans-serif;font-size:16px;color:var(--green);">SERIES WIN 2-1 🪓</span>
        </div>
      </div>
    </div>
  `;
}

// ── INIT ──
renderOverview(document.getElementById("content"));
loadAI();
</script>
</body>
</html>
