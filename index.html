<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Braves"/>
  <meta name="theme-color" content="#0a0f0d"/>
  <title>Braves Dashboard</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="braves-icon.png"/>
  <link rel="icon" type="image/png" href="braves-icon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Anton&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#002B5C;--red:#CE1141;--bg:#0a0f0d;--card:#0d1a0f;--card2:#0a1628;
      --green:#22c55e;--yellow:#facc15;--crimson:#ef4444;--blue:#38bdf8;
      --text:#e8ede9;--muted:#8ab4a0;--dim:#5a7a62;--border:#1e3a26;
      --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
    }
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
    #app{display:flex;flex-direction:column;min-height:100dvh;margin:0 auto;position:relative;width:100%}
    /* ── DESKTOP HERO BANNER ── */
    .hero-banner{width:100%;display:block;background:#000;line-height:0;border-bottom:2px solid var(--red)}
    .hero-banner img{display:block;width:100%;height:auto;max-height:130px;object-fit:cover;object-position:center center}
    .hdr-inner{max-width:1400px;margin:0 auto;width:100%}
    .hdr{background:linear-gradient(135deg,var(--navy),#0a1628);border-bottom:2px solid var(--red);padding:calc(var(--safe-top) + 8px) 16px 8px;flex-shrink:0;box-shadow:0 4px 20px rgba(206,17,65,.25)}
    .hdr-row{display:flex;align-items:center;gap:12px}
    .logo{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--navy));display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:15px;color:#fff;box-shadow:0 0 16px rgba(206,17,65,.5);flex-shrink:0}
    .hdr-title{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:1.5px}
    .hdr-sub{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:1px}
    .hdr-rec{margin-left:auto;text-align:right;font-family:'Anton',sans-serif;font-size:24px;color:var(--green);text-shadow:0 0 10px rgba(34,197,94,.4);line-height:1}
    .hdr-rec-sub{font-size:9px;color:var(--muted);margin-top:2px}
    .hdr-game-strip{display:flex;align-items:center;gap:8px;margin-top:7px;padding:6px 0 1px;border-top:1px solid rgba(255,255,255,.07);min-height:0}
    .hdr-gs-tag{font-size:9px;font-weight:900;letter-spacing:1.5px;padding:2px 7px;border-radius:4px;color:#fff;flex-shrink:0;text-transform:uppercase}
    .hdr-gs-score{font-family:'Anton',sans-serif;font-size:15px;color:var(--text);letter-spacing:.5px}
    .hdr-gs-meta{font-size:9px;color:var(--dim);letter-spacing:.5px;margin-left:auto;text-align:right;white-space:nowrap}
    .refresh-pill{display:inline-flex;align-items:center;gap:5px;font-size:9px;color:var(--dim);background:#0a1410;border:1px solid var(--border);border-radius:20px;padding:3px 8px;margin-top:6px;cursor:pointer}
    .refresh-pill.live{color:var(--green);border-color:#22c55e44}
    .pulse{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
    .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px calc(80px + var(--safe-bottom));max-width:1400px;margin:0 auto;width:100%}
    .bnav{position:fixed;bottom:0;left:0;right:0;width:100%;background:rgba(10,15,13,.97);backdrop-filter:blur(16px);border-top:1px solid #1e3a26;display:flex;padding-bottom:var(--safe-bottom);z-index:100;justify-content:center}
    .bnav-inner{display:flex;width:100%;max-width:1400px}
    /* ── DESKTOP RESPONSIVE LAYOUT ── */
    @media (min-width:900px){
      .content{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;padding:24px 32px 110px;align-content:start}
      .content > *{margin-bottom:0}
      .loading-overlay{grid-column:1 / -1}
      .bnav-inner .nbtn{flex:0 1 220px;flex-direction:row;gap:10px;padding:14px 18px}
      .bnav-inner .nbtn .ni{font-size:20px}
      .bnav-inner .nbtn .nl{font-size:11px}
      .hero-banner img{max-height:160px}
    }
    @media (min-width:1280px){
      .content{grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px;padding:32px 48px 110px}
      .hero-banner img{max-height:180px}
    }
    /* On mobile browser, show a slimmer hero crop */
    @media (max-width:899px){
      .hero-banner img{max-height:80px;object-position:center center}
    }
    /* ── STATS TAB: batting + pitching side-by-side on desktop ── */
    @media (min-width:900px){
      #content[data-tab="stats"]{grid-template-columns:repeat(2,minmax(0,1fr))}
      #content[data-tab="stats"] > .leg{grid-column:1 / -1}
    }
    /* ── STANDALONE PWA (iPhone home-screen app) ── */
    /* Lock to mobile-app feel: no hero image, fixed 480px column, fixed bottom nav */
    @media all and (display-mode:standalone){
      #app{max-width:480px;height:100dvh}
      .hero-banner{display:none}
      .content{display:block;max-width:none;padding:14px 12px calc(80px + var(--safe-bottom))}
      .content > *{margin-bottom:12px}
      .bnav{left:50%;right:auto;transform:translateX(-50%);max-width:480px}
      .bnav-inner{max-width:480px}
      .bnav-inner .nbtn{flex:1;flex-direction:column;gap:3px;padding:10px 4px 8px}
      .bnav-inner .nbtn .ni{font-size:18px}
      .bnav-inner .nbtn .nl{font-size:8px}
    }
    .nbtn{flex:1;border:none;background:none;color:var(--dim);padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif}
    .nbtn.active{color:var(--green)}
    .nbtn .ni{font-size:18px;line-height:1}
    .nbtn .nl{font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
    .ct{font-size:10px;font-weight:700;letter-spacing:2px;margin-bottom:12px;text-transform:uppercase}
    .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .sb{background:#0a1410;border:1px solid #1e3a26;border-radius:10px;padding:12px 8px;text-align:center}
    .sl{font-size:9px;color:var(--dim);letter-spacing:1.5px;margin-bottom:4px;text-transform:uppercase}
    .sv{font-family:'Anton',sans-serif;font-size:26px;line-height:1}
    .ss{font-size:9px;color:var(--dim);margin-top:3px}
    .aic{background:linear-gradient(135deg,#0d1f0f,#0a1628);border:1px solid #22c55e44;border-radius:14px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
    .aic::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--red))}
    .ail{font-size:10px;color:var(--green);letter-spacing:2px;font-weight:700;margin-bottom:8px}
    .ait{font-size:14px;line-height:1.6;color:#d4edda}
    .badge{display:inline-block;padding:3px 9px;border-radius:6px;font-weight:700;font-size:13px;font-family:'JetBrains Mono',monospace}
    .bg{background:#22c55e22;color:var(--green);border:1px solid #22c55e55}
    .by{background:#facc1522;color:var(--yellow);border:1px solid #facc1555}
    .br{background:#ef444422;color:var(--crimson);border:1px solid #ef444455}
    .ph{border-radius:14px;padding:16px;margin-bottom:12px}
    .ph.bat{background:linear-gradient(135deg,#0d1f0f,#091209);border:1px solid #22c55e55}
    .ph.pit{background:linear-gradient(135deg,#1a0d14,#0d0912);border:1px solid #CE114155}
    .pn{font-family:'Anton',sans-serif;font-size:20px;margin-bottom:2px}
    .pp{font-size:11px;color:var(--muted);margin-bottom:12px}
    .ps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .psi{text-align:center}
    .psl{font-size:9px;color:var(--dim);margin-bottom:3px;letter-spacing:1px}
    .psv{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700}
    .rrow{display:flex;gap:8px}
    .rpill{flex:1;border-radius:10px;padding:12px 8px;text-align:center}
    .rpill.w{background:#22c55e15;border:1px solid #22c55e44}
    .rpill.l{background:#ef444415;border:1px solid #ef444444}
    .rd{font-size:10px;color:var(--dim);margin-bottom:3px}
    .rl{font-family:'Anton',sans-serif;font-size:22px}
    .rs{font-family:'JetBrains Mono',monospace;font-size:14px}
    .wm{display:flex;align-items:center;gap:16px;margin-bottom:14px}
    .wt{font-family:'Anton',sans-serif;font-size:48px;line-height:1;color:#fff}
    .wds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
    .wdi{font-size:12px}
    .frow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
    .frow::-webkit-scrollbar{display:none}
    .fday{flex-shrink:0;text-align:center;padding:10px;border-radius:10px;border:1px solid #1e3a46;min-width:56px;background:#0a1420}
    .fday.today{background:#38bdf822;border-color:#38bdf844}
    .fl{font-size:9px;color:var(--blue);font-weight:700;margin-bottom:3px;letter-spacing:1px}
    .fi{font-size:20px;margin-bottom:3px}
    .fh{font-family:'JetBrains Mono',monospace;font-size:13px;color:#fff}
    .fo{font-family:'JetBrains Mono',monospace;font-size:11px;color:#5a7a82}
    .fr{font-size:10px;font-weight:700;margin-top:3px}
    .abar{margin-top:10px;padding:10px 12px;border-radius:8px;background:#ef444415;border:1px solid #ef444433;font-size:12px;color:#fca5a5;line-height:1.5}
    .plist{display:flex;flex-direction:column;gap:10px}
    .prow{background:#0d1a0f;border:1px solid var(--border);border-radius:12px;padding:12px 14px}
    .ptop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .prn{font-weight:700;font-size:15px;flex:1}
    .prp{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700}
    .prp.sp{background:#002B5C44;color:#60a5fa}
    .prp.rp{background:#CE114122;color:#f87171}
    .prp.bat{background:#22c55e11;color:var(--green)}
    .prstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .pri{text-align:center}
    .pril{font-size:9px;color:var(--dim);letter-spacing:1px;margin-bottom:2px}
    .stbl{width:100%;border-collapse:collapse}
    .stbl th{font-size:10px;color:var(--dim);letter-spacing:1.5px;padding:6px 8px;text-align:center;font-weight:700}
    .stbl th:first-child{text-align:left}
    .stbl td{padding:10px 8px;border-bottom:1px solid var(--border);font-size:14px}
    .stbl td:not(:first-child){text-align:center;font-family:'JetBrains Mono',monospace}
    .stbl tr.me td:first-child{color:var(--green);font-weight:700}
    .stbl tr.me{background:#22c55e08}
    .rbrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
    .rbn{font-size:10px;color:var(--dim);width:18px;flex-shrink:0}
    .rbnm{flex:1;font-size:13px}
    .rbw{width:70px;height:5px;background:#1e3a26;border-radius:3px;overflow:hidden;flex-shrink:0}
    .rbb{height:100%;border-radius:3px}
    .rbp{font-family:'JetBrains Mono',monospace;font-size:12px;width:36px;text-align:right;flex-shrink:0}
    .mhdr{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#0d1a0f,var(--card2));border:1px solid #CE114155;border-radius:14px;padding:16px;margin-bottom:12px}
    .mvs{font-family:'Anton',sans-serif;font-size:26px}
    .gc{background:#0a1a0c;border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
    .gcn{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-family:'Anton',sans-serif;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .gcdate{font-weight:700;font-size:14px}
    .gcloc{font-size:12px;color:var(--muted);margin-top:1px}
    .gctime{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--yellow)}
    .mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center}
    .mav{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;text-align:left}
    .mlab{font-size:10px;color:var(--dim);letter-spacing:1px;text-align:center;text-transform:uppercase}
    .mbv{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;text-align:right}
    .ebox{margin-top:12px;padding:12px;border-radius:10px;background:#22c55e11;border:1px solid #22c55e33;text-align:center;font-size:13px;line-height:1.6}
    .hltbl{width:100%;border-collapse:collapse}
    .hltbl th{font-size:9px;color:var(--dim);letter-spacing:1.5px;padding:4px 4px;text-align:center;font-weight:700}
    .hltbl th:first-child{text-align:left;padding-left:8px}
    .hltbl td{padding:9px 4px;border-bottom:1px solid var(--border);font-size:13px;text-align:center;font-family:'JetBrains Mono',monospace}
    .hltbl td:first-child{text-align:left;padding-left:8px;font-family:'DM Sans',sans-serif}
    .leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin-bottom:12px}
    .leg span{display:flex;align-items:center;gap:4px}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{width:14px;height:14px;border:2px solid #22c55e44;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
    .loading-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 20px;text-align:center}
    .loading-overlay .big-spin{width:40px;height:40px;border:3px solid #22c55e22;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}
    .loading-msg{font-size:13px;color:var(--muted)}
    /* HEALTH MONITOR */
    #health-dot{width:9px;height:9px;border-radius:50%;transition:all .3s;cursor:pointer;flex-shrink:0;margin-left:auto}
    #health-dot.green{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.6)}
    #health-dot.yellow{background:#facc15;box-shadow:0 0 8px rgba(250,204,21,.6)}
    #health-dot.red{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.7);animation:pulse .7s infinite}
    .h-ov{position:fixed;inset:0;background:rgba(5,10,8,.97);z-index:500;display:flex;flex-direction:column;overscroll-behavior:none}
    .h-hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top,0px) + 14px) 16px 14px;background:#0a1410;border-bottom:1px solid var(--border);flex-shrink:0}
    .h-ttl{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:1px}
    .h-cls{background:none;border:none;color:var(--dim);font-size:30px;cursor:pointer;line-height:1;padding:0 4px}
    .h-body{flex:1;overflow-y:auto;padding:14px 12px calc(24px + var(--safe-bottom,0px));-webkit-overflow-scrolling:touch}
    .h-sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
    .h-s{background:#0d1a0f;border:1px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center}
    .h-sv{font-family:'Anton',sans-serif;font-size:24px;line-height:1}
    .h-sl{font-size:9px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
    .h-sys{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
    .h-sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .h-sn{font-size:13px;font-weight:700;flex:1}
    .h-ss{font-size:11px;color:var(--muted)}
    .h-ev{padding:9px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
    .h-ei{font-size:14px;width:20px;flex-shrink:0;text-align:center;margin-top:1px}
    .h-em{font-size:12px;line-height:1.5;flex:1}
    .h-et{font-size:9px;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-top:2px}
    .h-empty{text-align:center;color:var(--dim);padding:24px;font-size:13px}
    /* CHARTS */
    .chart-card{padding:14px}
    .chart-card svg{display:block;width:100%;height:auto}
    .chart-card text{font-family:'JetBrains Mono',monospace}
    @media (min-width:900px){
      #content[data-tab="trends"]{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
    }
    /* PLAYER CARDS — original design, MLB headshots, click-to-flip */
    .cards-intro{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px}
    .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;margin-bottom:6px}
    @media (min-width:900px){.cards-grid{grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:28px}}
    @media (min-width:1280px){.cards-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:30px}}
    @media all and (display-mode:standalone){.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}}
    @media (min-width:900px){
      #content[data-tab="cards"]{grid-template-columns:1fr}
    }
    .pcard{position:relative;aspect-ratio:5/7;min-height:238px;perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent}
    @media (min-width:900px){.pcard{min-height:287px}}
    .pcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}
    .pcard.flipped .pcard-inner{transform:rotateY(180deg)}
    .pcard-face,.pcard-back{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.05)}
    .pcard-face{background:linear-gradient(165deg,#0a1d3d 0%,#002B5C 40%,#0a1628 100%);border:3px solid var(--red)}
    .pcard-back{background:linear-gradient(165deg,#0a1d3d 0%,#0d1a0f 50%,#091209 100%);border:3px solid var(--green);transform:rotateY(180deg)}
    .pcard-face::before,.pcard-back::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--red),var(--navy),var(--red));z-index:1}
    .pcard-strip{padding:10px 12px 6px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(206,17,65,.85),rgba(206,17,65,.0));position:relative;z-index:2}
    .pcard-team{font-family:'Anton',sans-serif;font-size:11px;letter-spacing:2px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
    .pcard-jersey{font-family:'Anton',sans-serif;font-size:20px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);line-height:1}
    .pcard-photo{flex:1;background:radial-gradient(circle at 50% 35%,#1d3a6a 0%,#0a1d3d 55%,#000 100%);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative;min-height:0}
    .pcard-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.55));pointer-events:none}
    .pcard-photo img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
    .pcard-photo.no-photo::before{content:'⚾';font-size:54px;opacity:.35;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
    .pcard-name-block{background:linear-gradient(0deg,rgba(0,0,0,.94),rgba(0,0,0,.6) 70%,transparent);padding:18px 12px 12px;position:relative;z-index:2;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
    .pcard-pos-badge{font-family:'Anton',sans-serif;font-size:11px;letter-spacing:2px;color:#fff;padding:3px 9px;border-radius:5px;line-height:1.2}
    .pcard-name{font-family:'Anton',sans-serif;font-size:19px;color:#fff;line-height:1.05;text-shadow:0 1px 3px rgba(0,0,0,.85);letter-spacing:.5px}
    @media (min-width:900px){.pcard-name{font-size:22px}.pcard-team{font-size:12px}.pcard-jersey{font-size:24px}.pcard-pos-badge{font-size:12px}}
    .pcard-flip-hint-front{position:absolute;top:10px;right:12px;font-size:18px;opacity:.7;z-index:3;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
    .pcard-back-strip{padding:12px 14px 10px;background:linear-gradient(180deg,rgba(34,197,94,.25),transparent);position:relative;z-index:2;border-bottom:1px solid rgba(34,197,94,.2)}
    .pcard-back-name{font-family:'Anton',sans-serif;font-size:16px;color:#fff;letter-spacing:.5px;line-height:1.1}
    .pcard-back-meta{font-size:10px;color:var(--muted);letter-spacing:1.5px;margin-top:3px}
    .pcard-back-scroll{flex:1;overflow-y:auto;padding:10px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#22c55e44 transparent;min-height:0}
    .pcard-back-scroll::-webkit-scrollbar{width:5px}
    .pcard-back-scroll::-webkit-scrollbar-thumb{background:#22c55e55;border-radius:3px}
    .pcard-back-scroll::-webkit-scrollbar-track{background:transparent}
    .pcard-stat-section{font-size:9px;color:var(--green);letter-spacing:1.8px;font-weight:700;margin:8px 0 5px;text-transform:uppercase;opacity:.9}
    .pcard-stat-section:first-child{margin-top:0}
    .pcard-stat-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(34,197,94,.1);font-size:12px;align-items:baseline}
    .pcard-stat-row:last-child{border-bottom:none}
    .pcard-stat-l{font-size:10px;color:var(--dim);letter-spacing:1.2px;font-weight:700;text-transform:uppercase}
    .pcard-stat-v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px}
    .pcard-stat-avg{font-size:9px;color:var(--dim);font-family:'JetBrains Mono',monospace}
    .pcard-flip-hint{font-size:9px;color:var(--dim);text-align:center;padding:6px 0 8px;letter-spacing:1.5px;border-top:1px solid rgba(34,197,94,.1)}
    .pcard-live-pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite;margin-right:5px;vertical-align:middle}
    /* ANALYST SOCIAL FEED */
    .social-feed{display:flex;flex-direction:column;overflow-y:auto;max-height:360px;-webkit-overflow-scrolling:touch;margin:-4px 0}
    .social-feed::-webkit-scrollbar{display:none}
    .social-item{padding:12px 2px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;-webkit-tap-highlight-color:transparent}
    .social-item:last-child{border-bottom:none}
    .social-item:active{background:#38bdf808}
    .social-meta{display:flex;align-items:center;gap:7px;margin-bottom:5px}
    .social-badge{font-size:9px;font-weight:900;padding:2px 6px;border-radius:3px;letter-spacing:.5px;text-transform:uppercase;flex-shrink:0;background:#cc0000;color:#fff}
    .social-time{font-size:10px;color:var(--dim)}
    .social-byline{font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
    .social-hdl{font-size:13px;font-weight:700;line-height:1.4;color:var(--text);margin-bottom:3px}
    .social-desc{font-size:11px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

    /* ── SCHEDULE TAB ── */
    .sch-seg{display:flex;gap:6px;margin-bottom:12px}
    .sch-seg button{flex:1;padding:9px 6px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--dim);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;transition:all .15s}
    .sch-seg button.on{border-color:var(--green);color:var(--green);background:#22c55e12}
    .sch-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border)}
    .sch-row:last-child{border-bottom:none}
    .sch-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);width:52px;flex-shrink:0}
    .sch-opp{font-size:13px;font-weight:700;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sch-loc{font-size:10px;color:var(--dim);font-weight:400}
    .sch-res{font-family:'Anton',sans-serif;font-size:15px;width:18px;text-align:center;flex-shrink:0}
    .sch-score{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);width:44px;text-align:right;flex-shrink:0}
    .sch-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);width:64px;text-align:right;flex-shrink:0}
    .sch-empty{text-align:center;color:var(--dim);padding:24px;font-size:13px}

    /* ── WILD CARD ── */
    .wc-row{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--border)}
    .wc-row:last-child{border-bottom:none}
    .wc-row.cut{border-bottom:2px dashed #facc1555}
    .wc-seed{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);width:20px;flex-shrink:0}
    .wc-name{flex:1;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .wc-rec{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);width:52px;text-align:right;flex-shrink:0}
    .wc-gb{font-family:'JetBrains Mono',monospace;font-size:11px;width:38px;text-align:right;flex-shrink:0}
    .magic{display:inline-block;padding:3px 9px;border-radius:5px;background:#facc1518;border:1px solid #facc1544;color:var(--yellow);font-size:11px;font-weight:700;margin-left:6px}

    /* ── PLAYER SEARCH ── */
    .psearch{position:relative;margin-bottom:12px}
    .psearch input{width:100%;padding:11px 34px 11px 34px;border-radius:9px;border:1px solid var(--border);background:#0a1410;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .15s}
    .psearch input:focus{border-color:var(--green)}
    .psearch input::placeholder{color:var(--dim)}
    .psearch .ps-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6;pointer-events:none}
    .psearch .ps-clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--dim);font-size:17px;cursor:pointer;padding:2px 6px;line-height:1}
    .ps-count{font-size:10px;color:var(--dim);letter-spacing:.8px;margin-bottom:8px}

    /* ── INJURED LIST ── */
    .il-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
    .il-item{display:flex;align-items:center;gap:7px;padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:#1a0f0f40}
    .il-pos{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:var(--yellow);background:#facc1515;padding:2px 5px;border-radius:3px;flex-shrink:0}
    .il-name{font-size:12px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ── MOTION ── */
    @keyframes cardIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
    #content > .card,#content > .chart-card{animation:cardIn .34s cubic-bezier(.22,.7,.3,1) both}
    #content > *:nth-child(1){animation-delay:0ms}
    #content > *:nth-child(2){animation-delay:45ms}
    #content > *:nth-child(3){animation-delay:90ms}
    #content > *:nth-child(4){animation-delay:135ms}
    #content > *:nth-child(5){animation-delay:180ms}
    #content > *:nth-child(n+6){animation-delay:215ms}
    @media (prefers-reduced-motion:reduce){
      #content > .card,#content > .chart-card{animation:none}
      .pcard-inner{transition:none!important}
    }
  </style>
</head>
<body>
<div id="app">
  <div class="hero-banner">
    <img src="braves-header.png" alt="Braves Dashboards"/>
  </div>
  <div class="hdr">
    <div class="hdr-inner">
      <div class="hdr-row">
        <div class="logo">ATL</div>
        <div><div class="hdr-title">BRAVES DASHBOARD</div><div class="hdr-sub">LIVE · 2026 SEASON</div></div>
        <div style="margin-left:auto;text-align:right"><div class="hdr-rec" id="hdr-rec">49-26</div><div class="hdr-rec-sub" id="hdr-rec-sub">1ST NL EAST · .654</div></div>
      </div>
      <div class="hdr-game-strip" id="hdr-game-strip"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
        <div class="refresh-pill live" id="refresh-pill" data-act="refresh">
          <div class="pulse"></div>
          <span id="refresh-label">Refreshing every 2 min</span>
        </div>
        <div style="font-size:9px;color:var(--dim);flex:1" id="last-updated"></div>
        <div id="health-dot" class="green" data-act="health-open" title="System Health — tap to view"></div>
      </div>
    </div>
  </div>

  <div class="content" id="content">
    <div class="loading-overlay">
      <div class="big-spin"></div>
      <div class="loading-msg">Loading live Braves data…</div>
    </div>
  </div>

  <nav class="bnav">
    <div class="bnav-inner">
      <button class="nbtn active" data-tab="overview"><span class="ni">🏠</span><span class="nl">Home</span></button>
      <button class="nbtn" data-tab="cards"><span class="ni">🎴</span><span class="nl">Cards</span></button>
      <button class="nbtn" data-tab="schedule"><span class="ni">📅</span><span class="nl">Schedule</span></button>
      <button class="nbtn" data-tab="trends"><span class="ni">📉</span><span class="nl">Trends</span></button>
      <button class="nbtn" data-tab="stats"><span class="ni">📈</span><span class="nl">Stats</span></button>
      <button class="nbtn" data-tab="standings"><span class="ni">📊</span><span class="nl">Standings</span></button>
    </div>
  </nav>
</div>

<script src="app.js" defer></script>
</body>
</html>
